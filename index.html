    // he sinks into the hole: only the part above the floor line or inside the hole shows
    ctx.save();
    ctx.beginPath(); ctx.rect(camX - 20, -40, W + 40, FLOOR + 40); ctx.rect(X - 16, FLOOR, 32, 40); ctx.clip();
    const say = t >= 3.2 && t < 3.9 ? 'YOINK!' : t >= 4.6 && t < 5.1 ? 'HEH HEH HEH!' : '';
    if (v.profY < 1) {
      drawOldMan({ x: px, y: py, arm: 0, flinch: t >= 4.6 && t < 5.1 ? 1 : 0, face: -1, dazed: v.dazed > 0, vial: v.vial >= 1,
                   alpha: 1 - v.profY, say: '', sayT: say ? 1 : 0, noBubble: true });
    }
    ctx.restore();
    if (say) bubble(say, px - 6, FLOOR - 54);
    if (v.vial < 1) {
      // the free vial, on its way from the plate to his hand
      const a = -0.5, hx = px - (6 + Math.cos(a) * 8) * BOSS_SCALE, hy = FLOOR + (-17 + Math.sin(a) * 8) * BOSS_SCALE;
      drawVial(cs.vx0 + (hx - cs.vx0) * v.vial, FLOOR - 6 + (hy - FLOOR + 6) * v.vial, 1.4);
    }
    // the plate, hinged on its left edge
    ctx.save();
    ctx.translate(X - 16, FLOOR - 1); ctx.rotate(v.hatch * 1.4);
    drawHatchPlate();
    ctx.restore();
  },
  pose(v) {
    const p = player, X = ARENA.hatchX, t = cs.t, x1 = X - 44, u = v.nin, w = v.ninY;
    const walking = (u > 0 && u < 1) || (u > 1 && u < 2), hop = t > 9.4;
    p.x = u <= 1 ? cs.x0 + (x1 - cs.x0) * u : x1 + 20 * (u - 1);
    if (hop) p.x = X - 24 + 24 * clamp((t - 9.4) / 0.3, 0, 1);       // the hop carries her over the hole
    p.y = t < 9.4 ? cs.y0 + (FLOOR - cs.y0) * w : w > 1 ? FLOOR - (w - 1) * 48 : FLOOR + (1 - w) * 35;
    p.facing = u < 1 && x1 < cs.x0 ? -1 : 1;
    p.onGround = !hop; p.vy = hop ? (t < 9.55 ? -100 : 200) : 0;
    p.elev = 0; p.aimDown = false;
    p.vx = walking ? RUN * p.facing : 0;           // only for the leg animation: the pose owns her position
    if (walking) p.run += STEP * 14;
    // the wreck keeps smoking
    if (Math.random() < 0.25) particles.push({ x: boss.x + rand(-30, 30), y: FLOOR - 100, vx: rand(-10, 20), vy: -rand(80, 130), life: 0.55, max: 0.55, r: rand(2, 3.6), color: '#8d99c4' });
  },
  done: finishLevel,
};
// The closing cutscene of each level, by the level's outro key.
const CUTS = { ESCAPE, CLIMB, ENDING };
// Runs the level's closing cutscene. x0, y0, vx0 and px0 are where the ninja, the vial and the professor were.
function startOutro() {
  const p = player, b = boss;
  p.vx = 0; p.facing = 1; p.inv = 0; p.sq = 0;
  bullets = []; bombs = []; clouds = [];
  skipArm = 0;
  sfx.pickup();
  setState('ending');
  csStart(CUTS[L.outro]);
  Object.assign(cs, { x0: p.x, y0: p.y, vx0: b.vial ? b.vial.x : 0, px0: b.prof ? b.prof.x : 0 });
}

// The level report: works out the bonuses, banks them into the campaign score and hands out a life.
function finishLevel() { overStreak = 0;
  const secs = Math.floor(runTime), all = lvl.rescued === POSTDOCS.length, base = score - run.score0;
  const rows = [
    ['LEVEL SCORE', base],
    ['TIME ' + fmtTime(runTime), Math.max(0, L.par - secs) * SCORE.timePerSec],
    ['POSTDOCS ' + lvl.rescued + ' / ' + POSTDOCS.length + (all ? '  FULL LAB MEETING' : ''), all ? SCORE.allPostdocs : 0],
    ['PPE ' + player.ppe + ' / 3', SCORE.ppeLeft * player.ppe],
  ];
  const total = rows.reduce((s, r) => s + r[1], 0);
  score = run.score0 + total;
  run.stats[levelN] = { total, time: secs, rescued: lvl.rescued, of: POSTDOCS.length, deaths: lvl.deaths };
  run.time += secs;
  const gain = lives < LIVES_MAX;
  lives = Math.min(LIVES_MAX, lives + 1);
  let rank = GRADES[0];
  L.grades.forEach((g, i) => { if (total >= g) rank = GRADES[i]; });
  results = { kind: 'level', head: 'INCIDENT REPORT ' + (levelN + 1) + ' OF ' + LEVELS.length, sub: L.name, rows, total, rank,
              info: 'CAMPAIGN ' + score + (gain ? '    +1 LIFE' : ''), newBest: false, t: 0 };
  if (levelN < LEVELS.length - 1) saveProgress(levelN + 2);   // the clear is saved as soon as the report shows
  setState('results');
}
// The campaign report, after the last level's own. Its total is the score that counts for the best.
function finishRun() {
  const rows = LEVELS.map((lv, i) => [(i + 1) + '  ' + lv.name + (run.stats[i] ? '' : '  SKIPPED'), run.stats[i] ? run.stats[i].total : 0]);
  rows.push(['LIVES ' + lives + (run.continues ? ', CONTINUES ' + run.continues : ', NO CONTINUES'),
             SCORE.lifeLeft * lives + (run.continues ? 0 : SCORE.noContinue)]);
  const total = rows.reduce((s, r) => s + r[1], 0);
  score = total;
  let rank = RANKS[0][1];
  for (const r of RANKS) if (total >= r[0]) rank = r[1];
  const of = LEVELS.reduce((n, lv) => n + lv.postdocs.length, 0);
  results = { kind: 'final', head: 'FINAL INCIDENT REPORT', sub: 'CRYPTOBACTER: CONTAINED', rows, total, rank,
              info: 'TIME ' + fmtTime(run.time) + '    POSTDOCS ' + run.saved.length + ' / ' + of, newBest: total > best, t: 0 };
  if (total > best) { best = total; try { localStorage.setItem('cb-best', best); } catch (e) {} }
  done = true;
  try { localStorage.setItem('cb-done', 1); } catch (e) {}
  // the fastest time only counts for a whole campaign
  if (run.from === 0 && run.time > 0 && (!fastest || run.time < fastest)) { fastest = run.time; try { localStorage.setItem('cb-fast', fastest); } catch (e) {} }
  setState('results');
}
function updateResults(dt) {
  const R = results, t0 = R.t, sumAt = TALLY_END - TALLY.count;
  R.t += dt;
  // ticks while a row counts up, a chime when the total lands
  const u = (R.t - TALLY.lead) % TALLY.row;
  if (R.t > TALLY.lead && R.t < sumAt && u < TALLY.count && Math.floor(R.t * 20) > Math.floor(t0 * 20)) tone(900, 900, 0.02);
  if (t0 < sumAt && R.t >= sumAt) tone(520, 1040, 0.25, 'triangle', 0.05);
}

function updateBlob(e, dt, mult) {
  const p = player;
  e.sq *= Math.pow(0.001, dt);
  const wasGround = e.onGround;
  moveBody(e, dt);
  if (e.onGround && !wasGround) { e.vx = 0; e.sq = -0.3; }
  if (e.enc) {
    if (e.x < camX + e.r) { e.x = camX + e.r; e.vx = Math.abs(e.vx); }
    if (e.x > camX + W - e.r) { e.x = camX + W - e.r; e.vx = -Math.abs(e.vx); }
  }
  if (e.onGround) {
    e.timer -= dt * mult;
    if (e.timer <= 0) {
      const dir = Math.sign(p.x - e.x) || 1;
      const above = p.y < e.y - 20;
      e.vx = dir * rand(55, 85) * mult * (e.size === 2 ? 1 : 1.25);
      e.vy = -(above && Math.random() < 0.6 ? 345 : rand(190, 250));
      // Step off a shelf when the ninja is below it.
      if (e.onPlat && p.y > e.y + 20 && Math.random() < 0.5) e.drop = 0.25;
      e.sq = 0.3;
      e.timer = rand(0.45, 1.0);
    }
  }
  e.drop -= dt;
}

function updatePuffer(e, dt, mult) {
  e.t += dt;
  e.x += e.vx * mult * dt;
  e.y = e.base + Math.sin(e.t * 2) * 10;
  const lo = e.home != null ? e.home - 50 : camX + 12, hi = e.home != null ? e.home + 50 : camX + W - 12;
  if (e.x < lo && e.vx < 0) e.vx = -e.vx;
  if (e.x > hi && e.vx > 0) e.vx = -e.vx;
  e.drop -= dt * mult;
  if (e.drop <= 0 && e.x > camX + 10 && e.x < camX + W - 10) {
    spores.push({ x: e.x, y: e.y + 8, vy: 70 * mult });
    e.drop = rand(1.8, 2.6);
  }
}

// Bacillus Roller: walks, revs up, then charges in a straight line. Floor only, so pits swallow it.
function updateRod(e, dt, mult) {
  const p = player, dx = p.x - e.x;
  e.sq *= Math.pow(0.001, dt);
  if (e.y > FLOOR || inPit(e.x)) { e.vy += GRAV * dt; e.y += e.vy * dt; return; }
  if (e.sleep) { if (p.x >= e.sleep) e.sleep = 0; else return; }
  e.t -= dt;
  if (e.mode === 'walk') {
    e.dir = Math.sign(dx) || 1;
    e.x += e.dir * ROD.walk * mult * dt;
    if (Math.abs(dx) < ROD.sight && Math.abs(p.y - e.y) < 60 && e.x > camX + 12 && e.x < camX + W - 12) {
      e.mode = 'rev'; e.t = ROD.revT;
      tone(120, 480, ROD.revT, 'sawtooth', 0.04);
    }
  } else if (e.mode === 'rev') {
    if (Math.random() < 0.4) particles.push({ x: e.x - e.dir * 14, y: e.y - 2, vx: -e.dir * rand(20, 50), vy: -rand(10, 40), life: 0.3, max: 0.3, r: rand(1, 2.2), color: '#c9d4f5' });
    if (e.t <= 0) { e.mode = 'charge'; e.t = ROD.chargeT; e.dir = Math.sign(dx) || e.dir; }
  } else if (e.mode === 'charge') {
    e.x += e.dir * ROD.charge * dt;
    const edge = e.dir < 0 ? e.x < camX + 10 : e.x > camX + W - 10;
    if (edge || e.t <= 0) {
      e.mode = 'dizzy'; e.t = ROD.dizzyT;
      if (edge) { sfx.land(); e.sq = 0.3; shake = Math.max(shake, 0.1); }
    }
  } else if (e.t <= 0) e.mode = 'walk';
}

function fireDart(e) {
  shots.push({ kind: 'dart', x: e.x + e.dir * 8, y: e.y - 12, vx: e.dir * PHAGE.dartSpeed, vy: 0, life: PHAGE.dartLife });
  tone(1500, 700, 0.08, 'square', 0.03);
}
// Phage Strider: keeps its distance, crouches to telegraph, then spits a dart along the floor.
function updatePhage(e, dt, mult) {
  const p = player, dx = p.x - e.x, ad = Math.abs(dx);
  e.cd -= dt; e.t -= dt;
  if (e.pend > 0 && (e.pend -= dt) <= 0) fireDart(e);
  let want = 0;
  const onScreen = e.x > camX + 12 && e.x < camX + W - 12;
  if (e.mode === 'walk') {
    e.dir = Math.sign(dx) || 1;
    if (!onScreen) want = e.x < camX + W / 2 ? 1 : -1;        // always step into view first
    else {
      want = ad > PHAGE.far ? e.dir : ad < PHAGE.near ? -e.dir : 0;
      const nx = e.x + want * 10;
      if (nx < camX + 12 || nx > camX + W - 12) want = 0;
      if (e.cd <= 0 && e.onGround && ad < PHAGE.far + 10) {
        e.mode = 'aim'; e.t = PHAGE.aimT; e.tick = false; want = 0;
        tone(1200, 1200, 0.04);
      }
    }
    if (inPit(e.x + want * 10)) want = 0;                     // stops short of pits
  } else {
    if (!e.tick && e.t <= PHAGE.aimT - 0.3) { e.tick = true; tone(1200, 1200, 0.04); }
    if (e.t <= 0) {
      fireDart(e);
      if (e.burst === 2) e.pend = 0.25;
      e.cd = PHAGE.cd; e.mode = 'walk';
    }
  }
  e.vx = want * PHAGE.walk * mult;
  moveBody(e, dt);
}

// Lab Rat: runs at the ninja, crouches, then pounces. It cannot reach a platform, so it paces underneath.
function updateRat(e, dt, mult) {
  const p = player, dx = p.x - e.x;
  if (e.sleep) { if (p.x >= e.sleep) e.sleep = 0; else return; }
  if (e.x > camX && e.x < camX + W) hintFire('rat');
  e.cd -= dt; e.t -= dt;
  if (e.mode === 'run') {
    if (e.onGround) {
      if (p.y < e.y - RAT.reach) {
        // out of reach: 40 px each way under her, no pounce
        if (e.x > p.x + 40) e.dir = -1; else if (e.x < p.x - 40) e.dir = 1;
        e.vx = e.dir * RAT.run * 0.6 * mult;
      } else {
        e.dir = Math.sign(dx) || e.dir;
        e.vx = Math.abs(dx) > 6 ? e.dir * RAT.run * mult : 0;
        if (Math.abs(dx) < RAT.sight && Math.abs(p.y - e.y) < RAT.reach && e.cd <= 0 && !inPit(e.x + e.dir * 40) && !inPit(e.x + e.dir * 78)) {
          e.mode = 'crouch'; e.t = RAT.crouchT; e.vx = 0;
          tone(1800, 2400, 0.08, 'square', 0.03);
        }
      }
      if (inPit(e.x + e.dir * 10)) e.vx = 0;                  // stops short of pits
    }
  } else if (e.mode === 'crouch') {
    const half = RAT.crouchT / 2;
    if (e.t <= half && e.t + dt > half) tone(1800, 2400, 0.08, 'square', 0.03);
    if (e.t <= 0) { e.mode = 'leap'; e.vx = e.dir * RAT.leapVx; e.vy = RAT.leapVy; }
  } else if (e.mode === 'skid') {
    e.vx *= Math.pow(0.02, dt);
    if (e.t <= 0) { e.mode = 'run'; e.cd = RAT.cd; }
  }
  moveBody(e, dt);
  if (e.mode === 'leap' && e.onGround) { e.mode = 'skid'; e.t = RAT.skid; e.vx *= 0.5; }
}

// Taq: a pressure cooker of a thermophile. Walks up, whistles, then vents a ring of steam around itself.
// Stay 37 px away or stand on anything 45 px up.
function updateTaq(e, dt, mult) {
  const p = player, dx = p.x - e.x, ad = Math.abs(dx);
  e.cd -= dt; e.t -= dt;
  let want = 0;
  if (e.mode === 'walk') {
    e.dir = Math.sign(dx) || 1;
    want = ad > 24 ? e.dir : 0;
    if (inPit(e.x + want * 12)) want = 0;                     // stops short of pits
    if (e.cd <= 0 && e.onGround && ad < TAQ.near && Math.abs(p.y - e.y) < 70 && e.x > camX + 12 && e.x < camX + W - 12) {
      e.mode = 'tel'; e.t = TAQ.telT; want = 0;
      tone(600, 1800, TAQ.telT, 'sine', 0.03);                // kettle whistle
    }
  } else if (e.mode === 'tel') {
    if (e.t <= 0) { e.mode = 'vent'; e.t = TAQ.ventT; burst(e.x, e.y - 8, '#ffffff', 14, 150); tone(2400, 900, 0.3, 'sawtooth', 0.02); }
  } else {
    if (Math.hypot(p.x - e.x, p.y - 11 - (e.y - 8)) < TAQ.ventR + 6) hurtPlayer(e.x);
    if (e.t <= 0) { e.mode = 'walk'; e.cd = TAQ.cd; }
  }
  e.vx = want * TAQ.walk * mult;
  moveBody(e, dt);
}

// Pathogen Pigeon: cruises overhead, locks on with a squawk, dives at where she stood, then climbs back.
function updatePigeon(e, dt, mult) {
  const p = player, dx = p.x - e.x, ad = Math.abs(dx);
  e.t += dt; e.cd -= dt * mult;
  if (e.mode === 'cruise') {                                  // also the climb back after a dive
    e.x += e.vx * mult * dt;
    e.y += clamp(e.base + Math.sin(e.t * 3) * 6 - e.y, -PIGEON.climb * dt, PIGEON.climb * dt);
    const lo = e.home != null ? e.home - 60 : camX + 14, hi = e.home != null ? e.home + 60 : camX + W - 14;
    if (e.x < lo && e.vx < 0) e.vx = -e.vx;
    if (e.x > hi && e.vx > 0) e.vx = -e.vx;
    if (e.cd <= 0 && Math.abs(e.y - e.base) < 10 && ad > PIGEON.min && ad < PIGEON.max && e.x > camX + 10 && e.x < camX + W - 10 && state === 'play') {
      e.mode = 'tel'; e.m = PIGEON.telT; e.tx = p.x; e.ty = p.y - 11; e.dir = Math.sign(dx) || 1;
      tone(1300, 700, 0.12, 'square', 0.03);                  // squawk
    }
  } else if (e.mode === 'tel') {
    if ((e.m -= dt) <= 0) {
      const d = Math.hypot(e.tx - e.x, e.ty - e.y) || 1;
      e.dvx = (e.tx - e.x) / d * PIGEON.dive; e.dvy = (e.ty - e.y) / d * PIGEON.dive; e.mode = 'dive';
    }
  } else {
    e.x += e.dvx * dt; e.y += e.dvy * dt;
    if (e.y >= Math.min(e.ty, FLOOR - 10)) { e.mode = 'cruise'; e.cd = PIGEON.cd; e.vx = e.dir * PIGEON.cruise; }
  }
}

// Biofilm Mat: rooted to the floor. Swells, then spits a glob at her feet.
function updateBiofilm(e, dt, mult) {
  const p = player;
  if (e.x < camX || e.x > camX + W) return;
  hintFire('film');
  if (e.tel > 0) {
    if ((e.tel -= dt) <= 0) {
      throwFlask(e.x, FLOOR - 8, p.x, p.onGround ? p.y : FLOOR, BIOFILM.flight).kind = 'glob';
      tone(420, 180, 0.12, 'triangle', 0.05);
    }
  } else if ((e.cd -= dt * mult) <= 0 && Math.abs(p.x - e.x) < BIOFILM.range && state === 'play') {
    e.tel = BIOFILM.tel; e.cd = BIOFILM.cd;
    tone(180, 360, BIOFILM.tel, 'sine', 0.04);
  }
}
// A boss glob lands on the arena floor: a puddle, and from phase 2 of Peer Review a rat crawls out of it.
function globSplat(x) {
  const C = BOSS2, D = BOSS3.drip;
  if (boss.kind === 'chair') { pools.push({ x, w: D.w, life: D.life }); return; }   // broth from the cracked vial
  pools.push({ x, w: C.lob.poolW, life: C.lob.poolT });
  if (boss.active && boss.phase >= 2 && enemies.length < C.ratCap) spawnEnemy('rat', x, { enc: true });
}

// Things a player shot can hit besides enemies. Returns true when the shot is used up.
function bulletVsProps(b) {
  for (const f of flasks) {
    if (!f.dead && Math.hypot(b.x - f.x, b.y - f.y) < 8) {
      f.dead = true;
      if (f.kind === 'glob') {
        score += SCORE.glob;
        burst(f.x, f.y, '#8fc43a', 8, 80);
        tone(260, 90, 0.1, 'triangle', 0.05);
        return true;
      }
      score += SCORE.flask;
      floater(f.x, f.y - 8, '+' + SCORE.flask);
      burst(f.x, f.y, '#9df06a', 8, 90); burst(f.x, f.y, '#e8f6ff', 5, 70);
      sfx.glass();
      return true;
    }
  }
  for (const s of shots) {
    const letter = s.kind === 'letter', hw = letter ? 8 : 6;
    if ((s.kind === 'dart' || s.kind === 'glob' || letter) && s.life > 0 && Math.abs(b.x - s.x) < hw && Math.abs(b.y - s.y) < hw) {
      s.life = 0; score += SCORE[s.kind];
      burst(s.x, s.y, s.kind === 'glob' ? '#8fc43a' : letter ? '#fff6e8' : '#ffe066', 4, 50);
      if (letter) floater(s.x, s.y - 8, 'REJECTED', '#ff6b78');
      return true;
    }
  }
  for (const ic of icicles) {
    if (ic.st < 3 && Math.abs(b.x - ic.x) < 5 && Math.abs(b.y - ic.y - 7) < 9) {
      score += SCORE.icicle;
      if (L.icicleLook === 'thesis') floater(ic.x, ic.y, 'UNREAD', '#fff6e8');
      shatterIcicle(ic);
      return true;
    }
  }
  for (let i = 0; i < POSTDOCS.length; i++) {
    const d = POSTDOCS[i];
    if (lvl.pd[i] === 0 && state === 'play' && Math.hypot(b.x - d.x, b.y - d.y + 10) < 9) { freePostdoc(i); return true; }
  }
  // The old man can't be hurt up there, but shooting him buys a moment.
  const om = oldMan;
  if (om.mode !== 'off' && Math.abs(b.x - om.x) < 11 && b.y < om.y && b.y > om.y - 45) {
    if (om.flinch <= 0) {
      om.flinch = 0.5; om.say = 'BAH!'; om.sayT = 0.6;
      om.timer += 0.35;
      sfx.bah();
    }
    return true;
  }
  return false;
}

function collect(k) {
  const p = player, t = k.type, Wp = WEAPONS[t];
  const full = () => { score += SCORE.ammoFull; floater(k.x, k.y - 12, '+' + SCORE.ammoFull, '#ffe066'); };
  if (t === 'ppe') {
    if (p.ppe < 3) p.ppe++;
    else { score += SCORE.ppeFull; floater(k.x, k.y - 12, '+' + SCORE.ppeFull, '#ffe066'); }
  } else if (Wp) {
    const had = kit.ammo[t];
    if (had >= Wp.max) full();
    else {
      kit.ammo[t] = Math.min(Wp.max, had + (k.n || Wp.pick));
      floater(k.x, k.y - 12, Wp.name + ' +' + (kit.ammo[t] - had), PICK_COL[t]);
    }
    if (t === 'abx') kit.abxGun = true;                     // any dose comes with the gun, so it cannot be missed for good
    else if (kit.sel === 'p10' && t !== 'p1000') selectWeapon(t);   // the antibiotic and the scarce P1000 never auto equip
    if (t === 'p20') hintFire('p20');
    if (t === 'p1000') hintFire('p1000');
  } else if (t === 'abxgun') {
    kit.abxGun = true;
    kit.ammo.abx = Math.max(kit.ammo.abx, WEAPONS.abx.pick);
    floater(k.x, k.y - 12, 'ANTIBIOTIC GUN', PICK_COL[t]);
    hintFire('abx');
  } else if (t === 'bleach' || t === 'gtc') {
    kit[t] = Math.min(INGREDIENT_MAX, kit[t] + 1);
    floater(k.x, k.y - 12, t === 'bleach' ? 'BLEACH' : 'GTC', PICK_COL[t]);
    if (kit.bleach && kit.gtc) mixBombs(); else hintFire('half');
  } else if (t === 'bomb') {
    if (kit.bombs < BOMB.max) { kit.bombs++; floater(k.x, k.y - 12, 'BLEACH BOMB', PICK_COL[t]); }
    else full();
  }
  k.life = 0; score += 5;
  burst(k.x, k.y, PICK_COL[t] || '#ffffff', 10);
  sfx.pickup();
}
// One bleach plus one GTC makes one bomb, while there is room for it.
function mixBombs() {
  while (kit.bleach && kit.gtc && kit.bombs < BOMB.max) {
    kit.bleach--; kit.gtc--; kit.bombs++;
    floater(player.x, player.y - 46, 'BLEACH + GTC = BOMB', PICK_COL.bomb);
    tone(400, 800, 0.1, 'triangle', 0.04); tone(800, 1600, 0.12, 'triangle', 0.04);
    hintFire('bomb');
  }
}

// ---------- Bleach bomb ----------
function throwBomb() {
  const p = player;
  if (kit.bombs <= 0 || kit.bombCd > 0) { sfx.empty(); return; }
  kit.bombs--; kit.bombCd = BOMB.cd;
  sfx.toss();
  mixBombs();                              // spare halves fill the gap
  const o = { rot: 0, t: 0, skip: null };
  if (p.aimDown || (keys.down && !keys.up)) {
    // dropped at her feet: it ignores the platform she stands on, and on the floor it goes off at once
    Object.assign(o, { x: p.x + p.facing * 4, y: p.y + 2, vx: p.facing * BOMB.dropVx, vy: BOMB.dropVy, skip: p.onPlat ? p.y : null });
  } else if (keys.up) Object.assign(o, { x: p.x + p.facing * 6, y: p.y - 18, vx: p.facing * BOMB.lobVx, vy: BOMB.lobVy });
  else Object.assign(o, { x: p.x + p.facing * 6, y: p.y - 18, vx: p.facing * BOMB.vx + p.vx * 0.5, vy: BOMB.vy });
  bombs.push(o);
}
// Flight of the thrown bombs and the gas they leave behind.
function updateBombs(dt) {
  const p = player, K = BOSSES[boss.kind];
  for (const b of bombs) {
    const y0 = b.y;
    b.t += dt; b.vy += BOMB.grav * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 12;
    if (Math.random() < 0.5) particles.push({ x: b.x, y: b.y, vx: rand(-15, 15), vy: rand(-40, -10), life: 0.3, max: 0.3, r: rand(0.8, 1.6), color: '#d8f24a' });
    let hit = b.t >= BOMB.fuse || (b.y >= FLOOR - 3 && !inPit(b.x) && y0 <= FLOOR + 4);
    if (!hit && b.vy > 0) hit = PLATS.some(pl => pl.y !== b.skip && y0 <= pl.y && b.y >= pl.y && b.x > pl.x - 3 && b.x < pl.x + pl.w + 3);
    if (!hit) hit = enemies.some(e => e.hp > 0 && hits(e, b, 5));
    if (!hit && K.box && boss.active && !boss.wreck) hit = K.box(b.x, b.y);
    if (hit) { b.dead = true; bombBlast(b.x, Math.min(b.y, FLOOR - 3)); }
    else if (b.y > H + 20 || b.x < camX - 60 || b.x > camX + W + 60) b.dead = true;   // down a pit or long gone
  }
  bombs = bombs.filter(b => !b.dead);

  for (const c of clouds) {
    c.t -= dt; c.tick -= dt;
    if (c.tick <= 0) {
      c.tick += BOMB.gasTick;
      for (const e of enemies.slice()) if (within(e, c.x, c.y, BOMB.gasR)) hitEnemy(e, BOMB.gasDmg, 'gas');
    }
    // it is toxic for her too, after a moment's grace: running through is safe, lingering is not
    if (Math.hypot(p.x - c.x, p.y - 11 - c.y) < BOMB.gasR - 6) { c.in += dt; if (c.in >= BOMB.gasGrace) hurtPlayer(c.x); }
    else c.in = Math.max(0, c.in - dt * 2);
  }
  clouds = clouds.filter(c => c.t > 0);
}
// Area damage, never to the ninja. Leaves a gas cloud.
function bombBlast(x, y) {
  const R = BOMB.r, near = (ox, oy) => Math.hypot(ox - x, oy - y) < R;
  let kills = 0;
  for (const e of enemies.slice()) {
    // every kill after the first in one blast is a combo
    if (e.hp > 0 && within(e, x, y, R) && hitEnemy(e, BOMB.dmg, 'blast') && e.hp <= 0 && ++kills > 1) {
      score += SCORE.bombCombo;
      floater(e.x, e.y - 20, '+' + SCORE.bombCombo, '#ffe066');
    }
  }
  if (boss.active) BOSSES[boss.kind].blast(x, y, R);
  for (const f of flasks) if (!f.dead && near(f.x, f.y)) { f.dead = true; burst(f.x, f.y, '#9df06a', 6, 80); }
  for (const s of spores) if (near(s.x, s.y)) s.y = 999;
  for (const s of shots) if (near(s.x, s.y)) s.life = 0;
  for (const ic of icicles) if (ic.st < 3 && near(ic.x, ic.y + 7)) shatterIcicle(ic);
  POSTDOCS.forEach((d, i) => { if (lvl.pd[i] === 0 && state === 'play' && near(d.x, d.y - 10)) freePostdoc(i); });
  pools = pools.filter(q => Math.abs(q.x - x) >= R);
  const om = oldMan;
  if (om.mode !== 'off' && near(om.x, om.y - 20)) { om.flinch = 0.5; om.say = 'COUGH! BAH!'; om.sayT = 0.9; om.timer += 1.0; sfx.bah(); }
  burst(x, y, '#d8f24a', 24, 180); burst(x, y, '#ffffff', 8, 120);
  shake = Math.max(shake, 0.25);
  tone(140, 40, 0.35, 'sawtooth', 0.09); tone(900, 200, 0.2, 'square', 0.04);
  tone(2600, 1800, 0.5, 'sawtooth', 0.012);                 // gas hiss
  floater(x, y - 24, BOMB_LINES[kit.bombLine++ % BOMB_LINES.length], '#d8f24a');
  clouds.push({ x, y: y - 8, t: BOMB.gasT, tick: 0, in: 0, seed: rand(0, 10) });
  if (clouds.length > BOMB.gasMax) clouds.shift();
}
// A P1000 going off: the direct hit is already dealt, this is the splash.
function explode(x, y, direct = null) {
  const Wp = WEAPONS.p1000;
  burst(x, y, '#ff9d2e', 14, 140); burst(x, y, '#ffffff', 6, 90);
  shake = Math.max(shake, 0.12);
  sfx.boom();
  for (const e of enemies.slice()) if (e !== direct && e.hp > 0 && within(e, x, y, Wp.splashR)) hitEnemy(e, Wp.splash, 'missile');
}

function updateWorld(dt) {
  const p = player, mult = sectionAt(camX + W / 2).tier;
  const px = p.x, py = p.y - 11;

  for (const b of bullets) {
    b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const mis = b.kind === 'missile';
    if (mis) {
      // accelerates along its heading and trails smoke
      const M = WEAPONS.p1000, sp = Math.hypot(b.vx, b.vy) || 1, k = Math.min(M.top, sp + M.accel * dt) / sp;
      b.vx *= k; b.vy *= k;
      if ((b.sm -= dt) <= 0) { b.sm = 0.04; particles.push({ x: b.x, y: b.y, vx: rand(-8, 8), vy: rand(-28, -12), life: 0.35, max: 0.35, r: rand(1.4, 2.4), color: '#8d99c4' }); }
      if (b.life <= 0) { explode(b.x, b.y); continue; }       // airburst at the end of its fuse
    }
    if (b.x < camX - 10 || b.x > camX + W + 10 || b.y < -10 || b.y > H + 10) b.life = 0;
    if (b.kind === 'spray' && pools.length && b.y > FLOOR - 8) {
      // ethanol wipes a boss puddle off the floor
      const q = pools.find(q => Math.abs(b.x - q.x) < q.w / 2);
      if (q) { q.life = 0; b.life = 0; score += SCORE.film; floater(q.x, FLOOR - 14, 'DISINFECTED', '#7dff5a'); burst(q.x, FLOOR - 3, '#9df06a', 6, 60); }
    }
    if (b.gnd && b.life > 0 && b.y >= FLOOR - 1 && !inPit(b.x)) {
      b.life = 0;
      // a shot from above lands on whatever grows on the floor there
      const mat = enemies.find(e => e.type === 'biofilm' && e.hp > 0 && Math.abs(b.x - e.x) < BIOFILM.hw && !(b.hit && b.hit.includes(e)));
      if (mat) hitEnemy(mat, b.dmg, b.kind);
      if (mis) explode(b.x, FLOOR - 2, mat); else burst(b.x, FLOOR - 1, '#c9d4f5', 2, 50);
    }
    if (b.life <= 0) continue;
    for (const e of enemies) {
      if (e.hp <= 0 || (b.hit && b.hit.includes(e)) || !hits(e, b)) continue;
      const did = hitEnemy(e, b.dmg, b.kind);
      if (mis) { explode(b.x, b.y, e); b.life = 0; }
      else if (did && b.pierce > 0) { b.pierce--; (b.hit = b.hit || []).push(e); }   // a P200 tip goes through one cell
      else b.life = 0;
      break;
    }
    if (b.life > 0 && (BOSSES[boss.kind].hit(b) || bulletVsProps(b))) {
      b.life = 0;
      if (mis) explode(b.x, b.y);
    }
  }
  bullets = bullets.filter(b => b.life > 0);
  updateBombs(dt);

  for (const e of enemies) {
    if (e.hp <= 0) continue;
    e.flash -= dt; e.plinkT -= dt; e.ring -= dt;
    if (e.res && e.x > camX && e.x < camX + W) hintFire('res');
    ENEMY[e.type].upd(e, dt, mult);
    if (e.type === 'biofilm') { if (e.x < camX - 80) { e.hp = 0; continue; } }   // rooted: left behind, never dragged along
    else if (e.enc) e.x = clamp(e.x, camX - ENC.side - 4, camX + W + ENC.side + 4);   // lock enemies can never be lost off screen
    else if (e.x < camX - 80) { e.hp = 0; continue; }          // left behind
    if (e.y > H + 20) { killEnemy(e, false); continue; }       // down a pit
    const c = centre(e);
    if (e.type === 'biofilm') { if (p.onGround && !p.onPlat && Math.abs(px - e.x) < 12) hurtPlayer(e.x); }   // only underfoot
    else if (Math.abs(c.x - px) < 5 + e.r * 0.8 && Math.abs(c.y - py) < 10 + e.r * 0.8) hurtPlayer(c.x);
  }
  for (const e of enemies) if (e.hp <= 0 && e.src != null) lvl.placed[e.src] = 2;
  enemies = enemies.filter(e => e.hp > 0);

  for (const s of spores) {
    s.y += s.vy * dt;
    if (windAt(s.x) === 2) s.x += WIND.air * dt;               // spores drift in a gust
    if (Math.abs(s.x - px) < 7 && Math.abs(s.y - py) < 12) { hurtPlayer(s.x); s.y = 999; }
    else if (s.y >= FLOOR - 2 && !inPit(s.x)) { burst(s.x, FLOOR - 2, '#b58bff', 4, 40); s.y = 999; }
  }
  spores = spores.filter(s => s.y < H);

  for (const s of shots) {
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
    const hb = SHOT_HIT[s.kind];
    if (s.life > 0 && Math.abs(s.x - px) < hb[0] && Math.abs(s.y - py) < hb[1] && p.inv <= 0 && state === 'play') { hurtPlayer(s.x); s.life = 0; }
    if (s.x < camX - 20 || s.x > camX + W + 20 || s.y < -30) s.life = 0;
    if (boss.active && s.x < ARENA.x0 + 6) s.life = 0;         // stops at the arena shutter
    if (s.kind === 'paper') {
      // rejection letters ignore platforms and end on the floor
      s.rot += dt * 10;
      if (s.life > 0 && s.y >= FLOOR - 3) { s.life = 0; burst(s.x, FLOOR - 3, '#fff6e8', 4, 50); }
    }
    if (s.kind === 'letter') {
      // a rejection letter of the Endowed Chair homes in for a while, then flies straight. It ends on the floor.
      const T = BOSS3.letters, sp = Math.hypot(s.vx, s.vy) || 1;
      if ((s.age += dt) < T.homeT) {
        const a = Math.atan2(s.vy, s.vx), want = Math.atan2(py - s.y, px - s.x);
        const na = a + clamp(Math.atan2(Math.sin(want - a), Math.cos(want - a)), -T.turn * dt, T.turn * dt);
        s.vx = Math.cos(na) * sp; s.vy = Math.sin(na) * sp;
      }
      if (s.life > 0 && s.y >= FLOOR - 3) { s.life = 0; burst(s.x, FLOOR - 3, '#fff6e8', 4, 50); }
    }
    if (s.kind === 'tube' && s.life > 0 && s.y >= FLOOR - 5) {
      s.life = 0;
      burst(s.x, FLOOR - 3, '#dff1ff', 6, 70); burst(s.x, FLOOR - 3, '#f0525e', 3, 50);
      sfx.glass();
    }
  }
  shots = shots.filter(s => s.life > 0);

  for (const f of flasks) {
    if (f.dead) continue;
    f.vy += FLASK_GRAV * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 9;
    const hitPlayer = Math.abs(f.x - px) < 8 && Math.abs(f.y - py) < 13;
    if (hitPlayer || (f.vy > 0 && f.y >= f.ty - 3)) {
      if (f.kind === 'glob') {
        // slime: nothing hatches from it, but a boss glob leaves a puddle where it lands on the floor
        if (hitPlayer) hurtPlayer(f.x);
        else if (f.pool && f.ty >= FLOOR && !inPit(f.x) && state === 'play') globSplat(f.x);
        burst(f.x, f.y, '#8fc43a', 10, 90);
        tone(260, 90, 0.1, 'triangle', 0.05);
        f.dead = true;
        continue;
      }
      if (hitPlayer) hurtPlayer(f.x);
      else if (f.ty >= FLOOR && !inPit(f.x) && enemies.length < (boss.active ? BOSSES[boss.kind].C.blobCap ?? BOSS.blobCap : FLASK_BLOB_CAP) && state === 'play') {
        spawnBlob(f.x, FLOOR - 4, 1, 0, -120).enc = !!lock;
      }
      burst(f.x, f.y, '#9df06a', 10, 100);
      burst(f.x, f.y, '#e8f6ff', 5, 70);
      sfx.glass();
      f.dead = true;
    }
  }
  flasks = flasks.filter(f => !f.dead);

  for (const k of pickups) {
    if (k.arc) {
      // lobbed by a postdoc
      const a = k.arc, u = Math.min(1, (a.t += dt) / 0.5);
      k.x = a.x0 + (a.x1 - a.x0) * u;
      k.y = a.y0 + (a.y1 - a.y0) * u - 56 * u * (1 - u);
      if (u >= 1) { k.arc = null; k.landed = true; }
      continue;
    }
    if (!k.landed) { k.y += CHUTE_SPEED * dt; if (k.y >= FLOOR - 7) { k.y = FLOOR - 7; k.landed = true; } }   // chutes and loose tips
    else k.life -= dt;
    if (state === 'play' && Math.abs(k.x - px) < 11 && Math.abs(k.y - py) < 16) collect(k);
  }
  pickups = pickups.filter(k => k.life > 0);
}

// ---------- Drawing helpers ----------
function paint(fill, stroke = INK, lw = 1.5) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function vgrad(y0, y1, c0, c1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  return g;
}
function eye(x, y, r, lx, ly, stroke = INK) {
  circ(x, y, r); paint('#fff', stroke, 1);
  circ(x + lx * r * 0.4, y + ly * r * 0.4, r * 0.5); paint('#141a33', null);
}
// Slanted eyelid plus brow line. inner is +1 when the nose side is to the right.
function lid(x, y, r, inner, fill, stroke, drop = 0.05) {
  const yl = y + (inner > 0 ? -0.75 : drop) * r, yr = y + (inner > 0 ? drop : -0.75) * r;
  ctx.save();
  circ(x, y, r + 0.6); ctx.clip();
  ctx.beginPath(); ctx.moveTo(x - r - 1, y - r - 1); ctx.lineTo(x + r + 1, y - r - 1); ctx.lineTo(x + r + 1, yr); ctx.lineTo(x - r - 1, yl); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(x - r - 0.8, yl); ctx.lineTo(x + r + 0.8, yr); paint(null, stroke, 1.3);
}
function text(str, x, y, size, fill, align = 'center', outline = null) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = size / 4; ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

// text() shrunk as far as it takes to fit maxW. Lines that name keys grow with the bindings.
function textFit(str, x, y, size, maxW, fill, align = 'center', outline = null) {
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width;
  text(str, x, y, w > maxW ? size * maxW / w : size, fill, align, outline);
}

// ---------- Characters ----------
function drawNinja(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing * (1 - p.sq), 1 + p.sq);
  const air = !p.onGround;
  const moving = Math.abs(p.vx) > 1 && !air;
  const step = moving ? Math.sin(p.run) : 0;
  const bob = moving ? Math.abs(Math.cos(p.run)) : 0;
  const drag = air ? clamp(p.vy * 0.012, -3, 3) : 0;   // cloth trails against vertical motion
  const sweep = moving ? 3 : air ? 1.5 : 0;            // and streams back at speed
  const SUIT = '#1a2040', SKIN = '#f2c9a4';
  ctx.lineCap = 'round';

  // sword slung across the back
  ctx.beginPath(); ctx.moveTo(-4.5, -5 - bob); ctx.lineTo(-8, -22 - bob); paint(null, INK, 3.4); paint(null, '#8d99c4', 1.6);
  ctx.beginPath(); ctx.moveTo(-8, -22 - bob); ctx.lineTo(-9.4, -29 - bob); paint(null, INK, 3.4); paint(null, '#f0525e', 1.6);
  ctx.beginPath(); ctx.moveTo(-10, -21.6 - bob); ctx.lineTo(-6, -22.4 - bob); paint(null, INK, 2.6); paint(null, '#ffe066', 1.1);

  // long headband tails
  for (let i = 0; i < 2; i++) {
    const wv = Math.sin(time * 9 + i * 1.7) * 2;
    ctx.beginPath();
    ctx.moveTo(-6, -25.6 - bob);
    ctx.quadraticCurveTo(-12 - sweep, -27 + wv - i * 2, -17 - sweep * 2 - i * 2, -23 + wv * 1.6 + i * 3.5 - drag * 2);
    paint(null, INK, 3.2); paint(null, '#f0525e', 1.8);
  }
  // legs and boots
  const lx1 = -4.4 + (air ? -1.5 : step * 3), lx2 = 1 - (air ? -1.5 : step * 3);
  rr(lx1, -7, 3.5, 7, 1.5); paint(SUIT);
  rr(lx2, -7, 3.5, air ? 5.5 : 7, 1.5); paint(SUIT);
  // coat tail flaring behind
  ctx.translate(0, -bob);
  ctx.beginPath();
  ctx.moveTo(-5.5, -12); ctx.lineTo(-9.5 - sweep, -3.5 - drag * 1.5 + step); ctx.lineTo(-3.5, -5); ctx.closePath();
  paint('#d5deef', INK, 1.3);
  // lab coat, open at the front over a dark suit with a red sash
  rr(-6, -16.5, 12, 12.5, 3.2); paint(vgrad(-16, -4, '#ffffff', '#cdd8ee'));
  ctx.beginPath(); ctx.moveTo(0.8, -16); ctx.lineTo(5.9, -14.5); ctx.lineTo(5.9, -6.2); ctx.lineTo(2.6, -4.4); ctx.closePath(); paint(SUIT, INK, 1);
  ctx.beginPath(); ctx.moveTo(2.4, -8.4); ctx.lineTo(4.9, -8.4); paint(null, '#f0525e', 1.5);
  // popped collar
  ctx.beginPath(); ctx.moveTo(-5.5, -15.5); ctx.lineTo(-7, -19.5); ctx.lineTo(-2, -16.5); ctx.closePath(); paint('#ffffff', INK, 1);
  // hood: only the eyes show
  circ(0, -21.5, 7.6); paint(vgrad(-29, -14, '#34406f', SUIT));
  rr(-3.4, -23.8, 10.4, 4.8, 2.2); paint(SKIN, INK, 1);
  const lx = Math.max(0.3, Math.cos(p.elev)), ly = -Math.sin(p.elev);
  for (const [ex, inner] of [[0.2, 1], [4.4, -1]]) {
    circ(ex, -21.3, 1.8); paint('#ffffff', null);
    circ(ex + lx * 0.75, -21.2 + ly * 0.6, 0.95); paint('#10142b', null);
    lid(ex, -21.3, 1.8, inner, SKIN, INK, -0.1);
  }
  // headband with a steel plate
  rr(-7.8, -27.6, 15.6, 2.8, 1.2); paint('#f0525e', INK, 1);
  rr(0.6, -28, 4.8, 3.6, 0.9); paint('#c9d4f5', INK, 0.9);
  // safety visor (first PPE layer)
  if (p.ppe >= 3) {
    ctx.beginPath(); ctx.moveTo(-2.8, -21.6); ctx.lineTo(-7.4, -21.2); paint(null, INK, 2.6); paint(null, '#2fb7d1', 1.2);
    rr(-2.8, -24.5, 10.6, 6, 2.5); paint('rgba(90,230,255,.5)', INK, 1.1);
    ctx.beginPath(); ctx.moveTo(-0.8, -23.2); ctx.lineTo(4.6, -23.2); paint(null, 'rgba(255,255,255,.85)', 0.8);
  }
  // arm and weapon
  // the shoulder slides forward as the aim rises so the arm never covers the eyes
  ctx.translate(1 + 5.5 * Math.sin(p.elev) ** 2, -12);
  ctx.rotate(-p.elev);
  rr(-1, -1.7, 7, 3.4, 1.7); paint('#f4f7fc', INK, 1);
  if (p.weapon === 'ethanol') {
    rr(6.5, -3, 6.5, 6, 1.6); paint('#ffb347', INK, 1);
    rr(13, -1.2, 3, 2.4, 0.8); paint('#e6edf7', INK, 0.9);
  } else if (p.weapon === 'multi') {
    rr(6.5, -3.5, 6, 7, 1.4); paint('#7c8cff', INK, 1);
    for (const ty of [-2.4, 0, 2.4]) {
      ctx.beginPath(); ctx.moveTo(12.5, ty - 1); ctx.lineTo(16.5, ty); ctx.lineTo(12.5, ty + 1); ctx.closePath(); paint('#ffe066', INK, 0.7);
    }
  } else if (p.weapon === 'p1000') {
    // fat barrel, blue cone
    rr(6.5, -2.4, 7, 4.8, 1.5); paint('#7c8cff', INK, 1);
    ctx.beginPath(); ctx.moveTo(13.5, -2.2); ctx.lineTo(19, 0); ctx.lineTo(13.5, 2.2); ctx.closePath(); paint('#4aa3ff', INK, 0.9);
  } else if (p.weapon === 'abx') {
    // syringe pistol
    ctx.beginPath(); ctx.moveTo(14.5, 0); ctx.lineTo(17.5, 0); paint(null, INK, 1);
    rr(6.5, -1.8, 8, 3.6, 1); paint('#ffffff', INK, 1);
    rr(9, -1.8, 2.4, 3.6, 0.4); paint('#ff3df0', null);
  } else {
    // pipette: the tip grows and changes colour with its size
    const tier = (WEAPONS[p.weapon] || WEAPONS.p10).tier, len = 3.5 + tier;
    rr(6.5, -1.6, 6, 3.2, 1.2); paint('#7c8cff', INK, 1);
    ctx.beginPath(); ctx.moveTo(12.5, -1.3); ctx.lineTo(12.5 + len, 0); ctx.lineTo(12.5, 1.3); ctx.closePath(); paint(TIP_COL[tier], INK, 0.9);
  }
  circ(6.6, 0.2, 2.1); paint(p.ppe >= 2 ? '#4aa3ff' : SKIN, INK, 1);
  ctx.restore();
}

function drawBlob(e) {
  const r = e.r, dx = player.x - e.x, dy = (player.y - 11) - (e.y - r), d = Math.hypot(dx, dy) || 1;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(1 - e.sq, 1 + e.sq);
  const hot = e.flash > 0;
  const fill = hot ? '#ffffff' : e.res ? vgrad(-2 * r, 0, RES.body[0], RES.body[1]) : vgrad(-2 * r, 0, '#a4e02e', '#2c8a2a');
  const ol = e.res ? RES.ol : '#0e3316', lidC = hot ? '#ffffff' : e.res ? RES.lid : '#7fc92c';
  // scalloped edge
  const n = e.size === 2 ? 9 : 7;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + Math.sin(time * 3 + e.seed) * 0.15;
    circ(Math.cos(a) * r * 0.86, -r + Math.sin(a) * r * 0.86, r * 0.3); paint(fill, ol, 1.4);
  }
  circ(0, -r, r * 0.92); paint(fill, null);
  const er = r * 0.3;
  eye(-r * 0.36, -r * 1.12, er, dx / d, dy / d, ol);
  eye(r * 0.36, -r * 1.12, er, dx / d, dy / d, ol);
  lid(-r * 0.36, -r * 1.12, er, 1, lidC, ol);
  lid(r * 0.36, -r * 1.12, er, -1, lidC, ol);
  // snarl with fangs
  rr(-r * 0.42, -r * 0.72, r * 0.84, r * 0.4, r * 0.14); paint('#3a0d1a', ol, 1);
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(sx * r * 0.34, -r * 0.72); ctx.lineTo(sx * r * 0.22, -r * 0.42); ctx.lineTo(sx * r * 0.1, -r * 0.72); ctx.closePath();
    paint('#ffffff', null);
  }
  ctx.restore();
}

function drawPuffer(e) {
  const dx = player.x - e.x, dy = (player.y - 11) - e.y, d = Math.hypot(dx, dy) || 1;
  const ol = e.res ? RES.ol : '#3a216e', r = e.r * (1 + Math.sin(e.t * 4) * 0.05);
  const lidC = e.flash > 0 ? '#ffffff' : e.res ? RES.lid : '#9a6be0';
  ctx.save();
  ctx.translate(e.x, e.y);
  const fill = e.flash > 0 ? '#ffffff' : e.res ? vgrad(-r, r, RES.body[0], RES.body[1]) : vgrad(-r, r, '#b98cf5', '#5a2fb0');
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + e.t * 0.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.22) * r, Math.sin(a - 0.22) * r);
    ctx.lineTo(Math.cos(a) * (r + 5.5), Math.sin(a) * (r + 5.5));
    ctx.lineTo(Math.cos(a + 0.22) * r, Math.sin(a + 0.22) * r);
    paint(fill, ol, 1.3);
  }
  circ(0, 0, r); paint(fill, ol, 1.4);
  eye(-2.8, -1.4, 2.5, dx / d, dy / d, ol);
  eye(2.8, -1.4, 2.5, dx / d, dy / d, ol);
  lid(-2.8, -1.4, 2.5, 1, lidC, ol);
  lid(2.8, -1.4, 2.5, -1, lidC, ol);
  rr(-2.4, 2.6, 4.8, 2.4, 1); paint('#2a0d3a', ol, 0.9);
  ctx.beginPath(); ctx.moveTo(-1.2, 2.6); ctx.lineTo(0, 4.4); ctx.lineTo(1.2, 2.6); ctx.closePath(); paint('#ffffff', null);
  ctx.restore();
}

function drawVial(x, y, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.shadowColor = '#7dff5a';
  ctx.shadowBlur = (8 + Math.sin(time * 6) * 4) * scale;
  rr(-2, -4, 4, 8, 1.6); paint('#9df06a', '#1f5a2a', 1);
  ctx.shadowBlur = 0;
  rr(-2.4, -5.6, 4.8, 2.2, 0.8); paint('#f0525e', INK, 0.9);
  ctx.restore();
}

// Speech bubble centred on x, kept inside the camera view. World space.
function bubble(str, x, y, ol = INK) {
  const w = str.length * 4.6 + 8;
  const bx = clamp(x - w / 2, camX + 4, camX + W - 4 - w);
  rr(bx, y - 6, w, 12, 5); paint('#ffffff', ol, 1.2);
  text(str, bx + w / 2, y + 0.5, 7, ol);
}

// Optional fields on om: scale, face (-1 mirrors), look (pupil target), vial (false hides it),
// noBubble, alpha, dazed.
function drawOldMan(om) {
  const ol = '#1c1524', S = om.scale || BOSS_SCALE, face = om.face || 1;
  const shakeX = om.flinch > 0 ? Math.sin(time * 60) * 1.2 : 0;
  ctx.save();
  ctx.globalAlpha = om.alpha ?? 1;
  ctx.save();
  ctx.translate(om.x + shakeX, om.y);
  ctx.scale(S * face, S);
  const breathe = Math.sin(time * 2.2) * 0.5;
  // cane
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-9, -13); ctx.arc(-7, -13, 2, Math.PI, 0); paint(null, ol, 3); paint(null, '#a0683a', 1.6);
  // legs
  rr(-4.5, -6, 3.6, 6, 1.4); paint('#3a3548', ol);
  rr(1, -6, 3.6, 6, 1.4); paint('#3a3548', ol);
  // hunched coat
  ctx.save();
  rr(-7.5, -17 + breathe, 15, 12.5 - breathe, 3); ctx.clip();
  ctx.fillStyle = '#fff6e8'; ctx.fillRect(-8, -18, 16, 14);
  ctx.fillStyle = 'rgba(240,120,30,.75)';
  for (let x = -7; x < 8; x += 4) ctx.fillRect(x, -18, 2, 14);
  for (let y = -16; y < -4; y += 4) ctx.fillRect(-8, y, 16, 2);
  ctx.fillStyle = 'rgba(150,60,10,.55)';
  for (let x = -4.4; x < 8; x += 4) ctx.fillRect(x, -18, 0.5, 14);
  for (let y = -13.4; y < -4; y += 4) ctx.fillRect(-8, y, 16, 0.5);
  ctx.restore();
  rr(-7.5, -17 + breathe, 15, 12.5 - breathe, 3); paint(null, ol);
  // cane hand
  circ(-8.6, -11.5, 1.9); paint('#f1c9a5', ol, 1);
  // ears and side hair
  const b = breathe;
  for (const sx of [-1, 1]) {
    circ(0.5 + sx * 8, -23 + b, 1.9); paint('#e2b08a', ol, 1);
    rr(0.5 + sx * 8 - 1.6, -31 + b, 3.2, 6.5, 1.5); paint('#f4f4ee', ol, 1);
  }
  // square head
  rr(-7.5, -32 + b, 16, 15.5, 4.5); paint(vgrad(-32, -16, '#f0c8a6', '#d9a47e'), ol);
  // full head of hair
  ctx.beginPath();
  ctx.moveTo(-8.4, -27.6 + b);
  ctx.quadraticCurveTo(-9.5, -35.5 + b, 0.5, -35 + b);
  ctx.quadraticCurveTo(10.5, -35.5 + b, 9.4, -27.6 + b);
  ctx.quadraticCurveTo(4, -29.8 + b, -1, -28.6 + b);
  ctx.quadraticCurveTo(-5, -27.6 + b, -8.4, -27.6 + b);
  ctx.closePath(); paint(vgrad(-35, -27, '#ffffff', '#d3d6df'), ol, 1.2);
  // thick square glasses, pupils track the ninja (knocked askew when dazed)
  const tgt = om.look || player;
  const dx = (tgt.x - om.x) * face, dy = tgt.y - om.y, d = Math.hypot(dx, dy) || 1;
  ctx.save();
  if (om.dazed) { ctx.translate(0.5, -24 + b); ctx.rotate(0.3); ctx.translate(-0.5, 24 - b); }
  for (const gx of [-6.3, 1.3]) {
    rr(gx, -26.4 + b, 6, 5, 1.2); paint('#dff1ff', '#0c0d14', 1.9);
    circ(gx + 3 + dx / d * 1.2, -23.9 + b + dy / d * 1.1, 1.15); paint('#0c0d14', null);
  }
  ctx.beginPath(); ctx.moveTo(-0.3, -24.6 + b); ctx.lineTo(1.3, -24.6 + b); paint(null, '#0c0d14', 1.6);
  ctx.restore();
  // heavy brows
  ctx.beginPath(); ctx.moveTo(-7, -28.6 + b); ctx.lineTo(-1, -26.6 + b);
  ctx.moveTo(8, -28.6 + b); ctx.lineTo(2, -26.6 + b);
  paint(null, ol, 2.8); paint(null, '#ffffff', 1.5);
  // big nose, clean-shaven scowl
  circ(0.5, -20.4 + b, 2); paint('#e0a888', ol, 1);
  if (om.sayT > 0) { rr(-1.6, -18.3 + b, 4.2, 1.9, 0.9); paint('#4a1420', ol, 0.8); }
  else { ctx.beginPath(); ctx.arc(0.5, -15.5 + b, 2.8, 1.2 * Math.PI, 1.8 * Math.PI); paint(null, ol, 1.1); }
  // hearing aid hooked over one ear
  rr(-10.6, -26 + b, 3.2, 5.6, 1.4); paint('#d8dce6', ol, 1);
  circ(-9, -22 + b, 0.7); paint('#ff4d5e', null);
  // shirt collar
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0.5, -15.4 + b); ctx.lineTo(0.5 + sx * 5, -17 + b); ctx.lineTo(0.5 + sx * 3.4, -12.6 + b); ctx.closePath();
    paint('#fff6e8', ol, 1);
  }
  if (om.dazed) {
    for (let i = 0; i < 3; i++) {
      const a = time * 5 + i * TAU / 3;
      circ(0.5 + Math.cos(a) * 9, -37 + b + Math.sin(a) * 2.5, 1.3); paint('#ffe066', ol, 0.7);
    }
  }
  // vial arm, raised when throwing
  ctx.translate(6, -13 + breathe);
  ctx.rotate(-0.5 - om.arm * 1.3);
  rr(-1, -1.7, 7.5, 3.4, 1.7); paint('#f39a45', ol, 1);
  rr(4.6, -1.7, 1.9, 3.4, 0.6); paint('#fff6e8', ol, 0.8);
  circ(7, 0, 1.9); paint('#f1c9a5', ol, 1);
  ctx.restore();
  // vial is drawn unscaled so its glow stays crisp
  const a = -0.5 - om.arm * 1.3;
  if (om.vial !== false) drawVial(om.x + shakeX + face * (6 + Math.cos(a) * 8) * S, om.y + (-13 + breathe + Math.sin(a) * 8 - 4) * S);
  if (om.sayT > 0 && !om.noBubble) {
    const w = om.say.length * 4.6 + 8;
    bubble(om.say, om.x + 14 + w / 2, Math.max(om.y - 54, HUD_CLEAR + 6), ol);   // on a gantry it would sit under the HUD
  }
  ctx.restore();
}

// Bacillus Roller. Drawn facing +x and flipped by e.dir.
function drawRod(e) {
  const hot = e.flash > 0, ol = e.res ? RES.ol : '#4a0d22', mad = e.mode === 'rev' || e.mode === 'charge';
  const [c0, c1, lidC] = e.res ? [RES.body[0], RES.body[1], RES.lid] : ['#ff7aa8', '#b0224f', '#e0507f'];
  ctx.save();
  ctx.translate(e.x + (e.mode === 'rev' ? Math.sin(time * 70) : 0), e.y);
  ctx.scale(e.dir * (1 - e.sq), 1 + e.sq);
  ctx.lineCap = 'round';
  // flagella trailing behind
  for (let i = 0; i < 3; i++) {
    const wv = Math.sin(time * 10 + i * 2) * 2.5, fy = -9.5 + i * 2.8;
    ctx.beginPath(); ctx.moveTo(-12, fy);
    ctx.quadraticCurveTo(-17, fy + wv, -22 - (mad ? 3 : 0), fy - wv * 0.6);
    paint(null, INK, 3); paint(null, c0, 1.5);
  }
  // stub feet, or speed lines at full tilt
  if (e.mode === 'charge') {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { ctx.moveTo(-9 + i * 8, -0.8); ctx.lineTo(-15 + i * 8, -0.8); }
    paint(null, '#ffffff', 1.4);
  } else {
    for (const fx of [-9.5, -4.5, 1.5, 6.5]) { rr(fx, -2.6, 3, 3.2, 1); paint(c1, ol, 1); }
  }
  rr(-13, -13.5, 26, 13, 6.5); paint(hot ? '#ffffff' : vgrad(-13, 0, c0, c1), ol, 1.4);
  // angry eyes on the front end
  for (const [ex, inner] of [[4.2, 1], [9.4, -1]]) {
    circ(ex, -8.6, 2.6); paint('#ffffff', ol, 1);
    circ(ex + 1, -8.4, 1.3); paint(mad ? '#ff2a3c' : '#141a33', null);
    lid(ex, -8.6, 2.6, inner, hot ? '#ffffff' : lidC, ol);
  }
  // snarl with fangs
  rr(3.4, -5.2, 8, 3.2, 1); paint('#3a0d1a', ol, 1);
  for (const fx of [4.4, 8.4]) {
    ctx.beginPath(); ctx.moveTo(fx, -5.2); ctx.lineTo(fx + 1, -2.8); ctx.lineTo(fx + 2, -5.2); ctx.closePath(); paint('#ffffff', null);
  }
  if (e.mode === 'dizzy') {
    for (let i = 0; i < 3; i++) {
      const a = time * 7 + i * TAU / 3;
      circ(5 + Math.cos(a) * 8, -17 + Math.sin(a) * 2.5, 1.4); paint('#ffe066', INK, 0.7);
    }
  }
  ctx.restore();
  if (e.sleep) text('z Z', e.x - e.dir * 4, e.y - 20 - Math.sin(time * 3) * 2, 6, '#ffffff', 'center', INK);
}

// Phage Strider: capsid head on a striped neck and six legs.
function drawPhage(e) {
  const hot = e.flash > 0, ol = '#0c2f38', aim = e.mode === 'aim';
  const sink = aim ? 3 : 0, walking = Math.abs(e.vx) > 1;
  const dx = player.x - e.x, dy = (player.y - 11) - (e.y - 17), d = Math.hypot(dx, dy) || 1;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.lineCap = 'round';
  if (aim) {
    // dotted line along the dart path
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(e.dir * 9, -12); ctx.lineTo(e.dir * 69, -12); paint(null, '#ffe066', 1);
    ctx.setLineDash([]);
  }
  for (let i = 0; i < 6; i++) {
    const sx = i < 3 ? -1 : 1, j = i % 3, sw = walking ? Math.sin(time * 12 + i) * 2 : 0;
    ctx.beginPath();
    ctx.moveTo(sx * 3, -5 + sink * 0.4);
    ctx.lineTo(sx * (6 + j * 2.6 + sink * 0.6), -9 + j + sink);   // knee
    ctx.lineTo(sx * (5 + j * 3.6) + sw, 0);
    paint(null, ol, 2.2); paint(null, '#7fe0d0', 1);
  }
  rr(-5, -6 + sink * 0.4, 10, 3, 1); paint(ol, null);
  // striped neck
  for (let k = 0; k < 4; k++) {
    ctx.fillStyle = k % 2 ? '#1f6f78' : '#c9f5ee';
    ctx.fillRect(-2, -14 + sink + k * (8 - sink) / 4, 4, (8 - sink) / 4 + 0.3);
  }
  rr(-2, -14 + sink, 4, 8 - sink * 0.6, 0.5); paint(null, ol, 1);
  // hexagon head
  ctx.translate(0, -17 + sink);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * TAU / 6; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7); }
  ctx.closePath();
  const pulse = aim && Math.floor(time * 16) % 2 === 0;
  paint(hot ? '#ffffff' : pulse ? '#ffe066' : vgrad(-7, 7, '#7fe0d0', '#1f6f78'), ol, 1.4);
  for (const [ex, inner] of [[-2.7, 1], [2.7, -1]]) {
    eye(ex, -1, 2, dx / d, dy / d, ol);
    lid(ex, -1, 2, inner, hot ? '#ffffff' : pulse ? '#ffe066' : '#4fb8ae', ol);
  }
  rr(-2, 2.2, 4, 2, 0.8); paint(ol, null);
  for (const fx of [-1.6, 0.4]) {
    ctx.beginPath(); ctx.moveTo(fx, 2.2); ctx.lineTo(fx + 0.6, 3.6); ctx.lineTo(fx + 1.2, 2.2); ctx.closePath(); paint('#ffffff', null);
  }
  ctx.restore();
}

// Lab Rat: escaped and infected. Drawn facing +x and flipped by e.dir.
function drawRat(e) {
  const hot = e.flash > 0, ol = e.res ? RES.ol : INK, crouch = e.mode === 'crouch';
  const run = Math.abs(e.vx) > 1 && e.onGround ? time * 22 : 0;
  const fur = hot ? '#ffffff' : e.res ? vgrad(-12, 0, RES.body[0], RES.body[1]) : vgrad(-12, 0, '#f1ede4', '#b9b2a6');
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.dir, 1);
  if (crouch) ctx.scale(1.12, 0.78);
  else if (e.mode === 'leap') ctx.rotate(clamp(e.vy / 600, -0.4, 0.4));
  ctx.lineCap = 'round';
  // tail: whips about, or stands straight up before a pounce
  ctx.beginPath(); ctx.moveTo(-10, -5);
  if (crouch) ctx.lineTo(-12, -19);
  else { const wv = Math.sin(time * 14 + e.x) * 3; ctx.bezierCurveTo(-15, -5 + wv, -18, -9 - wv, -24, -6 + wv); }
  paint(null, ol, 3.2); paint(null, '#ff9eb5', 1.6);
  ctx.beginPath();
  for (let i = 0; i < 4; i++) { const lx = -7 + i * 4.6; ctx.moveTo(lx, -2.5); ctx.lineTo(lx + (run ? Math.sin(run + i * 1.6) * 2 : 0), 0); }
  paint(null, ol, 1.6);
  ctx.beginPath(); ctx.ellipse(0, -6, 11, 6, 0, 0, TAU); paint(fur, ol, 1.5);
  if (!hot) {
    // infected patches
    circ(-4, -8, 3.6); paint('rgba(125,255,90,.3)', null); circ(-4, -8, 2.5); paint('#7fc92c', null);
    circ(2, -4.5, 2); paint('#7fc92c', null);
  }
  // head: ear with a tag, red eye, fangs
  circ(6, -11.5, 2.5); paint('#ff9eb5', ol, 1);
  rr(4.4, -15, 2, 3, 0.5); paint('#ffe066', ol, 0.6);
  circ(9, -7, 5); paint(fur, ol, 1.5);
  circ(10.2, -8.2, 1.8); paint(crouch && Math.floor(time * 20) % 2 ? '#ffffff' : '#ff2e3e', ol, 0.7);
  lid(10.2, -8.2, 1.8, 1, hot ? '#ffffff' : e.res ? RES.lid : '#cfc8ba', ol);
  circ(14, -6, 1.1); paint('#ff9eb5', ol, 0.6);
  for (const fx of [10.2, 12]) {
    ctx.beginPath(); ctx.moveTo(fx, -3.8); ctx.lineTo(fx + 0.75, -0.8); ctx.lineTo(fx + 1.5, -3.8); ctx.closePath(); paint('#ffffff', ol, 0.5);
  }
  ctx.restore();
  if (e.sleep) text('z Z', e.x - e.dir * 4, e.y - 18 - Math.sin(time * 3) * 2, 6, '#ffffff', 'center', INK);
}

// Taq: a pressure cooker on stub feet. The lid rattles while it whistles, then a ring of steam goes out.
function drawTaq(e) {
  const hot = e.flash > 0, ol = '#4a1a08', tel = e.mode === 'tel';
  const walk = Math.abs(e.vx) > 1 ? time * 12 : 0, jit = tel ? Math.sin(time * 70) : 0;
  const dx = player.x - e.x, dy = (player.y - 11) - (e.y - 10), d = Math.hypot(dx, dy) || 1;
  ctx.save();
  ctx.translate(e.x, e.y);
  [-7, -3, 1, 5].forEach((fx, i) => { rr(fx, -2.6 - (walk ? Math.max(0, Math.sin(walk + i * 1.6)) * 1.3 : 0), 3, 3.2, 1); paint('#c2410c', ol, 1); });
  rr(-9, -15, 18, 13, 5); paint(hot ? '#ffffff' : tel && Math.floor(time * 16) % 2 ? '#fff6e8' : vgrad(-15, -2, '#ffb347', '#c2410c'), ol, 1.5);
  rr(-11.5, -11, 3, 4, 1); paint('#3a3548', ol, 1);
  rr(8.5, -11, 3, 4, 1); paint('#3a3548', ol, 1);
  rr(-8, -17.5 + jit, 16, 3.5, 1.5); paint('#c9d4f5', ol, 1.2);
  rr(-1.5, -21 + jit, 3, 4, 1); paint('#8494bd', ol, 1);
  eye(-3.4, -10, 2.4, dx / d, dy / d, ol);
  eye(3.4, -10, 2.4, dx / d, dy / d, ol);
  lid(-3.4, -10, 2.4, 1, hot ? '#ffffff' : '#e07a1f', ol);
  lid(3.4, -10, 2.4, -1, hot ? '#ffffff' : '#e07a1f', ol);
  rr(-3.5, -6.5, 7, 3, 1); paint('#3a0d1a', ol, 0.9);
  for (const fx of [-2.6, 1.1]) { ctx.beginPath(); ctx.moveTo(fx, -6.5); ctx.lineTo(fx + 0.75, -4.4); ctx.lineTo(fx + 1.5, -6.5); ctx.closePath(); paint('#ffffff', null); }
  if (tel) {
    // steam leaving the valve
    for (let i = 0; i < 3; i++) { const u = (time * 3 + i / 3) % 1; circ(Math.sin(time * 9 + i * 2) * 2, -22 - u * 10, 1.2 + u * 2); paint(`rgba(255,255,255,${0.8 * (1 - u)})`, null); }
  } else if (e.mode === 'vent') {
    const u = clamp(1 - e.t / TAQ.ventT, 0, 1), R = TAQ.ventR * u;
    circ(0, -8, R); paint(null, 'rgba(255,255,255,.8)', 5);
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + time * 2; circ(Math.cos(a) * R, -8 + Math.sin(a) * R, 3.5); paint('rgba(255,255,255,.7)', null); }
  }
  ctx.restore();
}

// Pathogen Pigeon: an escaped experiment with a sickly green chest and one glowing eye. A dotted line marks its dive.
function drawPigeon(e) {
  const hot = e.flash > 0, ol = '#1c2240', dive = e.mode === 'dive';
  const dir = dive ? Math.sign(e.dvx) || 1 : e.mode === 'tel' ? e.dir : Math.sign(e.vx) || 1;
  const fill = hot ? '#ffffff' : vgrad(-6, 6, '#8d99c4', '#4a567f');
  if (e.mode === 'tel') {
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.tx, e.ty); paint(null, '#ffe066', 1.2);
    ctx.setLineDash([]);
    drawReticle(e.tx, e.ty + 11, 14);
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(dir, 1);
  if (dive) ctx.rotate(clamp(Math.atan2(e.dvy, Math.abs(e.dvx)), 0, 1.2));
  ctx.lineCap = 'round';
  // tail fan and feet
  ctx.beginPath();
  for (const a of [-0.4, 0, 0.4]) { ctx.moveTo(-8, 1); ctx.lineTo(-8 - Math.cos(a) * 5, 1 + Math.sin(a) * 5); }
  paint(null, ol, 2.8); paint(null, '#6f7ba6', 1.3);
  ctx.beginPath(); ctx.moveTo(-1, 6); ctx.lineTo(-2, 9); ctx.moveTo(2, 6); ctx.lineTo(2.5, 9); paint(null, '#ff8fa3', 1.2);
  ctx.beginPath(); ctx.ellipse(0, 0, 9, 6.5, 0, 0, TAU); paint(fill, ol, 1.5);
  if (!hot) { circ(3, 2, 3.2); paint('#9df06a', null); }
  rr(1, 5, 2, 1.5, 0.5); paint('#ffe066', ol, 0.5);
  circ(7, -4, 4); paint(fill, ol, 1.5);
  // beak with one fang, and the eye
  ctx.beginPath(); ctx.moveTo(10.5, -4.5); ctx.lineTo(15, -3); ctx.lineTo(10.5, -1.8); ctx.closePath(); paint('#ff9d2e', ol, 0.8);
  ctx.beginPath(); ctx.moveTo(11.4, -2); ctx.lineTo(12, -0.3); ctx.lineTo(12.6, -2.2); ctx.closePath(); paint('#ffffff', ol, 0.4);
  ctx.save();
  ctx.shadowColor = '#7dff5a'; ctx.shadowBlur = 4 * scale;
  circ(8, -4.6, 1.8); paint(e.mode === 'tel' && Math.floor(time * 20) % 2 ? '#ffffff' : '#7dff5a', ol, 0.7);
  ctx.restore();
  circ(8.3, -4.5, 0.8); paint(INK, null);
  lid(8, -4.6, 1.8, 1, hot ? '#ffffff' : '#6f7ba6', ol);
  // wing: beating, or swept flat back in a dive
  ctx.beginPath(); ctx.moveTo(-2, -2); ctx.lineTo(-9, dive ? -3 : -2 - 9 * Math.sin(time * 18 + e.x * 0.1)); ctx.lineTo(3, -1); ctx.closePath(); paint(hot ? '#ffffff' : '#aab4d4', ol, 1.2);
  ctx.restore();
}

// Biofilm Mat: a low slime dome with eyes on stalks. It swells before it spits.
function drawBiofilm(e) {
  const hot = e.flash > 0, ol = '#1f3a14', u = e.tel > 0 ? 1 - e.tel / BIOFILM.tel : 0;
  const fill = hot ? '#ffffff' : vgrad(-8, 0, '#5f8f2a', '#2f5a1f');
  const lumps = [[-7.5, 6.5, 4.5], [0, 9, 7], [7.5, 6.5, 4.5]];
  ctx.save();
  ctx.translate(e.x, FLOOR);
  ctx.lineCap = 'round';
  // roots
  ctx.beginPath();
  for (const rx of [-9, -3, 3, 9]) { ctx.moveTo(rx, 0); ctx.lineTo(rx + Math.sign(rx) * 1.5, 3); }
  paint(null, ol, 1.4);
  ctx.scale(1, 1 + u * 0.5 + Math.sin(time * 3 + e.seed) * 0.05);
  // lumpy dome: the outlines first, so the lumps read as one body
  for (const [cx, rx, ry] of lumps) { ctx.beginPath(); ctx.ellipse(cx, 0, rx, ry, 0, Math.PI, 0); paint(null, ol, 3); }
  for (const [cx, rx, ry] of lumps) { ctx.beginPath(); ctx.ellipse(cx, 0, rx, ry, 0, Math.PI, 0); paint(fill, null); }
  ctx.beginPath(); ctx.ellipse(-1, -1, 6, 4.5, 0, 1.15 * Math.PI, 1.6 * Math.PI); paint(null, 'rgba(255,255,255,.35)', 1);
  for (let i = 0; i < 3; i++) {
    const k = (time * 0.7 + i * 0.33 + e.seed) % 1;
    ctx.globalAlpha = 1 - k;
    circ(-7 + i * 7, -5 - k * 5, 1.5 + k); paint('#9df06a', null);
  }
  ctx.globalAlpha = 1;
  if (u > 0) { circ(0, -8 - u * 5, 1.5 + u * 2.5); paint('#9df06a', ol, 0.8); }   // the glob on its way out
  // eyes on stalks
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(sx * 4, -6); ctx.lineTo(sx * 4.6, -10.5); paint(null, ol, 2.4); paint(null, '#5f8f2a', 1);
    circ(sx * 4.6, -11.2, 1.7); paint('#ffe066', ol, 0.7);
    circ(sx * 4.6, -11, 0.6); paint(INK, null);
    lid(sx * 4.6, -11.2, 1.7, -sx, hot ? '#ffffff' : '#5f8f2a', ol);
  }
  ctx.restore();
}
// A ball of slime: lobbed by biofilm, spat by Peer Review.
function drawGlob(x, y, r = 4) {
  const w = Math.sin(time * 18 + x * 0.3) * 0.6;
  ctx.beginPath(); ctx.ellipse(x, y, r + w, r - w, 0, 0, TAU); paint('#8fc43a', '#4f7a2a', 1.2);
  circ(x - r * 0.3, y - r * 0.35, r * 0.28); paint('rgba(255,255,255,.6)', null);
}

// What marks a cell as resistant, drawn over its own art: a magenta halo with studs and a shield badge.
// The badge pops and a white ring flashes while a wrong weapon is bouncing off (e.ring).
function drawResMark(e) {
  const c = centre(e), R = e.r + 3, pop = e.ring > 0 ? 1.6 : 1;
  ctx.save();
  ctx.shadowColor = RES.glow; ctx.shadowBlur = (5 + 3 * Math.sin(time * 6 * TAU)) * scale;
  circ(c.x, c.y, R); paint(null, RES.glow, 1.2);
  ctx.restore();
  for (let i = 0; i < 3; i++) {
    const a = time * 1.2 + i * TAU / 3;
    circ(c.x + Math.cos(a) * R, c.y + Math.sin(a) * R, 1.2); paint(RES.glow, null);
  }
  if (e.ring > 0) { circ(c.x, c.y, e.r + 4); paint(null, '#ffffff', 1.5); }
  ctx.save();
  ctx.translate(c.x, c.y - e.r - 12 + Math.sin(time * 4 + e.x) * 1.2);
  ctx.scale(pop, pop);
  ctx.beginPath(); ctx.moveTo(-3.5, -4); ctx.lineTo(3.5, -4); ctx.lineTo(3.5, 0.5); ctx.quadraticCurveTo(3, 3.5, 0, 4.5); ctx.quadraticCurveTo(-3, 3.5, -3.5, 0.5); ctx.closePath();
  paint('#ffffff', INK, 1);
  text('R', 0, 0.2, 5, RES.glow);
  ctx.restore();
}

function drawShot(s) {
  if (s.kind === 'tip') {
    // the boss's pipette tips: the ninja's tip at twice the size
    ctx.beginPath(); ctx.moveTo(s.x + 7, s.y - 3); ctx.lineTo(s.x - 7, s.y); ctx.lineTo(s.x + 7, s.y + 3); ctx.closePath(); paint('#ff9d2e', '#7a1420', 1.2);
    return;
  }
  if (s.kind === 'tube') {
    rr(s.x - 2.5, s.y - 7, 5, 14, 2.5); paint('#dff1ff', INK, 1);
    rr(s.x - 1.5, s.y - 1, 3, 7, 1.5); paint('#f0525e', null);
    rr(s.x - 3, s.y - 8.5, 6, 3, 1); paint('#ffe066', INK, 0.8);
    return;
  }
  if (s.kind === 'glob') { drawGlob(s.x, s.y); return; }
  if (s.kind === 'paper') {
    // a rejection letter
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    rr(-4, -5, 8, 10, 1); paint('#fff6e8', INK, 1);
    ctx.beginPath(); ctx.moveTo(-2.2, -2.6); ctx.lineTo(2.2, -2.6); ctx.moveTo(-2.2, -0.4); ctx.lineTo(2.2, -0.4); paint(null, '#8d99c4', 0.7);
    ctx.beginPath(); ctx.moveTo(-2.4, 1.2); ctx.lineTo(2.4, 3.6); ctx.moveTo(2.4, 1.2); ctx.lineTo(-2.4, 3.6); paint(null, '#e0283c', 1.1);
    ctx.restore();
    return;
  }
  if (s.kind === 'letter') {
    // a rejection letter folded into a paper dart, nose along its heading
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-5, -3); ctx.lineTo(-3, 0); ctx.lineTo(-5, 3); ctx.closePath(); paint('#fff6e8', INK, 1);
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, 0); paint(null, '#8d99c4', 0.6);
    circ(-0.5, -1.2, 1); paint('#e0283c', null);
    ctx.restore();
    return;
  }
  // squiggle of injected DNA
  ctx.lineCap = 'round';
  for (const ph of [0, Math.PI]) {
    ctx.beginPath();
    for (let x = -4; x <= 4; x += 2) ctx.lineTo(s.x + x, s.y + Math.sin(x * 1.1 + time * 22 + ph) * 1.8);
    paint(null, INK, 2.6); paint(null, '#ffe066', 1.2);
  }
}

// mode: 'tied' on a chair, 'stand', 'run' (heading left), 'in' (jogging right) or 'hop' (cheering).
function drawPostdoc(d, x, y, mode) {
  const tied = mode === 'tied', run = mode === 'run' || mode === 'in';
  const hop = mode === 'hop' ? Math.abs(Math.sin(time * 9 + x)) * 4 : 0;
  const step = run ? Math.sin(time * 18) * 3 : 0;
  ctx.save();
  ctx.translate(x + (tied ? Math.sin(time * 10) : 0), y - hop);
  if (mode === 'run') ctx.scale(-1, 1);
  ctx.lineCap = 'round';
  if (tied) {
    // lab chair
    rr(-7, -20, 3, 12, 1); paint('#4a567f', INK, 1);
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, -1); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); paint(null, INK, 2.4); paint(null, '#8494bd', 1.1);
    rr(-6, -9, 12, 4, 1.5); paint('#4a567f', INK, 1);
    rr(-2, -11.5, 8.5, 3.5, 1.5); paint('#3a3548');
    rr(3.5, -11, 3.5, 9, 1.5); paint('#3a3548');
    ctx.translate(0, -3.5);
  } else {
    rr(-4.4 + step, -7, 3.5, 7, 1.5); paint('#3a3548');
    rr(1 - step, -7, 3.5, 7, 1.5); paint('#3a3548');
  }
  rr(-6, -16.5, 12, 12.5, 3.2); paint(vgrad(-16, -4, '#ffffff', '#cdd8ee'));
  if (tied) {
    // autoclave tape
    for (const ty of [-15, -10]) {
      rr(-7, ty, 14, 2.5, 1); paint('#f4ecd0', INK, 0.9);
      ctx.beginPath();
      for (let tx = -5; tx < 6; tx += 3.5) { ctx.moveTo(tx, ty + 2); ctx.lineTo(tx + 1.2, ty + 0.5); }
      paint(null, INK, 0.7);
    }
  } else {
    rr(1, -14, 3.2, 7, 1.6); paint('#f4f7fc', INK, 1);
  }
  // head, messy hair, round glasses, eye bags
  circ(0, -21.5, 6); paint('#f2c9a4');
  for (let i = 0; i < 5; i++) {
    const a = Math.PI * (1.08 + i * 0.21);
    circ(Math.cos(a) * 5.2, -22 + Math.sin(a) * 5.2, 2.5); paint(d.hair, INK, 1);
  }
  for (const gx of [-0.4, 4]) {
    circ(gx, -21.3, 2); paint('rgba(223,241,255,.7)', INK, 1);
    circ(gx + 0.4, -21.2, 0.7); paint(INK, null);
    ctx.beginPath(); ctx.arc(gx, -20.6, 2.5, 0.2 * Math.PI, 0.8 * Math.PI); paint(null, '#8a5a3a', 0.7);
  }
  if (tied) { rr(-0.4, -18.2, 5, 2, 0.6); paint('#f4ecd0', INK, 0.7); }
  else { ctx.beginPath(); ctx.arc(2, -18.6, 1.6, 0.1 * Math.PI, 0.9 * Math.PI); paint(null, INK, 0.9); }
  ctx.restore();
}

// ---------- Scene ----------
function drawVent(vx) {
  rr(vx - 16, -4, 32, 20, 3); paint(vgrad(0, 16, '#8494bd', '#5d6f9e'));
  ctx.beginPath();
  for (let y = 4; y < 14; y += 4) { ctx.moveTo(vx - 11, y); ctx.lineTo(vx + 11, y); }
  paint(null, INK, 1.2);
  const drip = (time * 0.7 + vx) % 1;
  circ(vx - 6, 16 + drip * 5, 1.6 * (1 - drip * 0.4)); paint('#9df06a', '#1f5a2a', 0.8);
}
function drawLamp(x, y, on) {
  const pulse = on ? 0.5 + 0.5 * Math.sin(time * 7) : 0;
  ctx.save();
  if (on) { ctx.shadowColor = '#ff4d5e'; ctx.shadowBlur = (4 + pulse * 14) * scale; }
  ctx.beginPath(); ctx.arc(x, y, 5, Math.PI, 0); ctx.closePath(); paint(!on ? '#5a2030' : pulse > 0.5 ? '#ff6b78' : '#c93a48', INK, 1.2);
  ctx.restore();
  rr(x - 7, y, 14, 3, 1); paint('#5d6f9e', INK, 1);
}
function drawBiohazard(x, y, r) {
  circ(x, y, r); paint('#ffe066', INK, r * 0.16);
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * TAU / 3;
    circ(x + Math.cos(a) * r * 0.41, y + Math.sin(a) * r * 0.41, r * 0.325); paint(null, INK, r * 0.175);
  }
  circ(x, y, r * 0.175); paint(INK, null);
}
function chain(x, y) {
  ctx.setLineDash([3, 2]);
  ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x, -4); ctx.lineTo(x, y); paint(null, INK, 2.2);
  ctx.lineCap = 'round';
  ctx.setLineDash([]);
}
function frost(x, y, w) {
  ctx.beginPath();
  for (let fx = 2; fx <= w - 2; fx += 4) ctx.lineTo(x + fx, y + 0.5 + Math.sin(fx * 0.9 + x) * 1.1);
  paint(null, 'rgba(255,255,255,.8)', 2);
}
function drawPlat(pl) {
  const { x, y, w } = pl, look = pl.look;
  if (look === 'shelf') {
    for (const bx of [x + 12, x + w - 12]) {
      ctx.beginPath(); ctx.moveTo(bx, y + 6); ctx.lineTo(bx, y + 18); ctx.lineTo(bx + (bx < x + w / 2 ? 12 : -12), y + 6);
      ctx.closePath(); paint('#4a567f', INK, 1.2);
    }
    rr(x, y, w, 7, 2.5); paint(vgrad(y, y + 7, '#aab4d4', '#6f7ba6'));
  } else if (look === 'pipe') {
    for (const bx of [x + 9, x + w - 9]) {
      ctx.beginPath(); ctx.moveTo(bx, -4); ctx.lineTo(bx, y); paint(null, INK, 3.2); paint(null, '#8494bd', 1.4);
    }
    rr(x, y, w, 7, 3.5); paint(vgrad(y, y + 7, '#8494bd', '#5d6f9e'));
    for (const fx of [x + 16, x + w - 20]) { rr(fx, y - 1, 4, 9, 1); paint('#aab4d4', INK, 1); }
  } else if (look === 'cart') {
    for (const bx of [x + 8, x + w - 8]) {
      ctx.beginPath(); ctx.moveTo(bx, y + 6); ctx.lineTo(bx, FLOOR - 5); paint(null, INK, 3.2); paint(null, '#8494bd', 1.4);
      circ(bx, FLOOR - 3, 3); paint('#1c2240', INK, 1);
    }
    rr(x + 5, y + 28, w - 10, 4, 1.5); paint('#8494bd', INK, 1.2);
    rr(x, y, w, 7, 2.5); paint(vgrad(y, y + 7, '#c9d4f5', '#8494bd'));
  } else if (look === 'freezer') {
    rr(x, y, w, FLOOR - y, 3); paint(vgrad(y, FLOOR, '#e9eef8', '#aab4d4'));
    const doors = Math.max(1, Math.round(w / 45));
    for (let i = 0; i < doors; i++) {
      const dx = x + i * w / doors;
      if (i) { ctx.beginPath(); ctx.moveTo(dx, y + 3); ctx.lineTo(dx, FLOOR - 2); paint(null, 'rgba(16,20,43,.5)', 1); }
      rr(dx + w / doors - 8, y + 12, 3, 12, 1.2); paint('#6f7ba6', INK, 0.9);
      circ(dx + 7, y + 13, 1.4); paint('#5ae6ff', INK, 0.6);
    }
    frost(x, y, w);
  } else if (look === 'crate') {
    const h = y >= 176 ? FLOOR - y : 30;
    if (h === 30) { chain(x + 6, y); chain(x + w - 6, y); }
    rr(x, y, w, h, 2); paint(vgrad(y, y + h, '#b98a4a', '#8a6a3a'));
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 7); ctx.lineTo(x + w - 2, y + 7);
    ctx.moveTo(x + 3, y + 9); ctx.lineTo(x + w - 3, y + h - 3); ctx.moveTo(x + w - 3, y + 9); ctx.lineTo(x + 3, y + h - 3);
    paint(null, 'rgba(16,20,43,.55)', 1.3);
  } else if (look === 'grate' || look === 'hung') {
    // slotted deck, on legs or hung on chains. The slots say: shoot down through me.
    if (look === 'hung') { chain(x + 6, y); chain(x + w - 6, y); }
    else for (const bx of [x + 6, x + w - 6]) { ctx.beginPath(); ctx.moveTo(bx, y + 5); ctx.lineTo(bx, FLOOR); paint(null, INK, 4.6); paint(null, '#4a567f', 2.4); }
    rr(x, y, w, 6, 1.5); paint(vgrad(y, y + 6, '#8494bd', '#4a567f'));
    ctx.beginPath();
    for (let gx = x + 4; gx < x + w - 2; gx += 5) { ctx.moveTo(gx, y + 1.6); ctx.lineTo(gx, y + 4.4); }
    paint(null, 'rgba(16,20,43,.6)', 1.4);
  } else if (look === 'rack') {
    // stainless cage rack, down to the floor
    rr(x, y, w, FLOOR - y, 3); paint(vgrad(y, FLOOR, '#a9bcc0', '#5f7478'));
    const cols = Math.floor((w - 4) / 19), pad = (w - cols * 19 + 3) / 2;
    for (let j = 0; y + 7 + j * 15 < FLOOR - 13; j++) {
      for (let i = 0; i < cols; i++) {
        const cx = x + pad + i * 19, cy = y + 7 + j * 15;
        rr(cx, cy, 16, 12, 2); paint('#16302f', INK, 0.9);
        if ((i * 3 + j * 5 + Math.floor(x / 10)) % 4 === 0) { circ(cx + 5.5, cy + 6, 1); paint('#ff4d5e', null); circ(cx + 10.5, cy + 6, 1); paint('#ff4d5e', null); }
      }
    }
  } else if (look === 'tank') {
    // riveted pressure vessel, down to the floor
    rr(x, y, w, FLOOR - y, 6); paint(vgrad(y, FLOOR, '#6a6490', '#3a3550'));
    rr(x, y + 8, w, 3.5, 1); paint('#8d99c4', INK, 0.9);
    for (let rx = x + 6; rx < x + w - 3; rx += 9) { circ(rx, y + 4, 0.9); paint(INK, null); }
    if (FLOOR - y > 34) {
      circ(x + w / 2, y + 24, 5.5); paint('#e9eef8', INK, 1);
      const a = -2.2 + Math.sin(time * 9 + x) * 0.25;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + 24); ctx.lineTo(x + w / 2 + Math.cos(a) * 4, y + 24 + Math.sin(a) * 4); paint(null, '#e0283c', 1);
    }
  } else if (look === 'autoclave') {
    // a floor standing autoclave: round door, hand wheel, a red LED
    const cx = x + w / 2, cy = (y + FLOOR) / 2 + 2, r = Math.min(18, (FLOOR - y) / 2 - 4);
    rr(x, y, w, FLOOR - y, 4); paint(vgrad(y, FLOOR, '#c9d4f5', '#8494bd'));
    circ(cx, cy, r); paint('#aab4d4', INK, 1.5);
    circ(cx, cy, r * 0.5); paint(null, INK, 3); paint(null, '#5d6f9e', 1.5);
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = i * TAU / 6; ctx.moveTo(cx - Math.cos(a) * r * 0.5, cy - Math.sin(a) * r * 0.5); ctx.lineTo(cx + Math.cos(a) * r * 0.5, cy + Math.sin(a) * r * 0.5); }
    paint(null, '#5d6f9e', 1.3);
    circ(x + 7, y + 6, 1.5); paint(Math.floor(time * 2 + x) % 2 ? '#ff4d5e' : '#7a2030', INK, 0.6);
  } else if (look === 'landing') {
    // concrete stair landing on a bracket, with a handrail behind
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(x + 3, y); ctx.lineTo(x + 3, y - 12); ctx.lineTo(x + w - 3, y - 12); ctx.lineTo(x + w - 3, y); paint(null, INK, 2.6); paint(null, '#8494bd', 1.2);
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(x + 8, y + 7); ctx.lineTo(x + 8, y + 22); ctx.lineTo(x + 26, y + 7); ctx.closePath(); paint('#4a5656', INK, 1.2);
    rr(x, y, w, 8, 2); paint(vgrad(y, y + 8, '#9aa6a6', '#5d6b6b'));
  } else if (look === 'ac') {
    // rooftop air conditioning unit, down to the roof
    rr(x, y, w, FLOOR - y, 3); paint(vgrad(y, FLOOR, '#c9d4f5', '#7f8bb0'));
    ctx.beginPath();
    for (let ly = y + 6; ly < FLOOR - 4; ly += 5) { ctx.moveTo(x + 4, ly); ctx.lineTo(x + w - 22, ly); }
    paint(null, 'rgba(16,20,43,.45)', 1);
    const fx = x + w - 12, fy = Math.min(y + 14, FLOOR - 11), a0 = time * 9 + x;
    circ(fx, fy, 8); paint('#2b3558', INK, 1.2);
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = a0 + i * TAU / 3; ctx.moveTo(fx, fy); ctx.lineTo(fx + Math.cos(a) * 6.5, fy + Math.sin(a) * 6.5); }

// Where the getaway helicopter hovers over the helipad. It leaves once the Endowed Chair is beaten.

// A small yellow wall sign, centred on (cx, cy).
function signPlate(str, cx, cy, size) {

// Night sky behind the rooftops: stars, a crescent moon, the skyline, rain and the parapet along the roof edge.
function drawSky(x0, x1) {
  const sky = sectionAt(x0 + 1).wall[0], span = W + 80;
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 40; i++) {
    const x = ((i * 97 - camX * 0.05) % span + span) % span + camX - 40;
    if (i % 5 === 0 && Math.sin(time * 3 + i) < 0) continue;   // every fifth one twinkles
    const sz = 0.6 + (i % 4) * 0.2;
    ctx.fillRect(x, 8 + (i * 53) % 120, sz, sz);
  }
  circ(camX + 380, 46, 14); paint('#fff6e8', null);
  circ(camX + 385, 43, 13); paint(sky, null);
  ctx.globalAlpha = 0.9;
  farProps(150, 0, (x, k) => {
    // far towers with a few lit windows, and an aircraft light on every fourth
    const h = Math.abs(k * 7919 + 13) % 97, w = 30 + h % 31, top = 110 + (h * 7) % 61;
    ctx.fillStyle = '#0c1030'; ctx.fillRect(x, top, w, FLOOR - top);
    ctx.fillStyle = '#ffe066';
    for (let wy = top + 6, j = 0; wy < FLOOR - 10; wy += 9, j++) {
      for (let wx = x + 4, i = 0; wx < x + w - 4; wx += 7, i++) if (Math.abs(k * 31 + i * 17 + j * 29) % 100 < 35) ctx.fillRect(wx, wy, 2, 3);
    }
    if ((k % 4 + 4) % 4 === 0 && Math.floor(time) % 2) { circ(x + w / 2, top - 2, 1.5); paint('#ff4d5e', null); }
  });
  ctx.globalAlpha = 1;
  ctx.beginPath();
  for (let i = 0; i < 20; i++) {
    const rx = camX + (i * 37 + time * 70) % W, ry = (i * 53 + time * 260) % FLOOR;
    ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 8);
  }
  paint(null, 'rgba(200,220,255,.2)', 1);
  // the parapet stops wherever the roof does
  let px = x0 - 4;
  for (const q of PITS) {
    if (q.look !== 'gap' || q.x + q.w < px || q.x > x1 + 4) continue;
    if (q.x > px) { rr(px, FLOOR - 6, q.x - px, 6, 1); paint('#5d6f9e', INK, 1); }
    px = q.x + q.w;
  }

}
// Wind sock on a pole. ph is the wind phase: it hangs when calm, flaps in the warning and stands out to the left in a gust.
function drawSock(x, ph) {
  const a = ph === 2 ? 0.04 * Math.sin(time * 30) : ph === 1 ? 0.78 + 0.26 * Math.sin(time * 22) : 1.4 + 0.05 * Math.sin(time * 2 + x);
  const top = FLOOR - 44, ux = -Math.cos(a), uy = Math.sin(a);
  ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.lineTo(x, top); paint(null, INK, 3); paint(null, '#8494bd', 1.4);
  for (let i = 0; i < 5; i++) {
    const d0 = i * 4.4, d1 = d0 + 4.4, w0 = 3.2 - i * 0.4, w1 = w0 - 0.4;
    ctx.beginPath();
    ctx.moveTo(x + ux * d0 - uy * w0, top + uy * d0 + ux * w0); ctx.lineTo(x + ux * d1 - uy * w1, top + uy * d1 + ux * w1);
    ctx.lineTo(x + ux * d1 + uy * w1, top + uy * d1 - ux * w1); ctx.lineTo(x + ux * d0 + uy * w0, top + uy * d0 - ux * w0);
    ctx.closePath(); paint(i % 2 ? '#ffffff' : '#ff9d2e', INK, 0.8);
  }
}
// Autoclave blast zones: the autoclave on the wall behind, its lamp, the drain plate and the bank of steam.
function drawSteamers() {

    const ph = steamPhase(s), cx = s.x + s.w / 2, on = ph === 2;

    ctx.beginPath();
    for (let x = s.x + 4; x < s.x + s.w - 2; x += 6) { ctx.moveTo(x, FLOOR - 1); ctx.lineTo(x, FLOOR + 1); }
    paint(null, INK, 1);
    if (ph === 1) {
      for (let i = 0; i < 6; i++) { const u = (time * 1.4 + i * 0.37) % 1; circ(s.x + (i + 0.5) * s.w / 6 + Math.sin(time * 4 + i) * 2, FLOOR - 3 - u * 16, 1.5 + u * 2); paint(`rgba(255,255,255,${0.6 * (1 - u)})`, null); }
    } else if (on) {

    }
  }
}

function drawSection(s) {
  const x0 = Math.max(s.x0, camX - 40), x1 = Math.min(s.x1, camX + W + 40);
  ctx.save();
  ctx.beginPath(); ctx.rect(s.x0, -20, s.x1 - s.x0, H + 40); ctx.clip();

  ctx.fillStyle = vgrad(FLOOR, H, s.floor[0], s.floor[1]);
  ctx.fillRect(x0, FLOOR, x1 - x0, H - FLOOR + 20);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let x = Math.floor(x0 / 48) * 48; x < x1; x += 48) ctx.fillRect(x, FLOOR, 24, H - FLOOR + 20);
  SCENERY[s.id](x0, x1);
  ctx.restore();
}

function drawFlushes() {
  for (const f of FLUSHES) {
    if (!vis(f.x, f.w + 14)) continue;
    const ph = flushPhase(f), x1 = f.x + f.w, c = (time + f.phase) % FLUSH.period;
    // dry grating strip
    rr(f.x, FLOOR - 1, f.w, 3, 1); paint('#4a567f', INK, 0.8);
    if (ph === 1) {
      // a trickle runs ahead of the surge
      ctx.beginPath();
      for (let x = x1; x >= f.x; x -= 6) ctx.lineTo(x, FLOOR - 2.5 + Math.sin(x * 0.4 + time * 16) * 0.8);
      paint(null, 'rgba(120,200,160,.8)', 1.5);
    } else if (ph === 2) {
      const t = c - (FLUSH.period - FLUSH.on), h = FLUSH.h * clamp(Math.min(t / 0.12, (FLUSH.on - t) / 0.2), 0, 1);
      ctx.fillStyle = 'rgba(120,200,160,.75)'; ctx.fillRect(f.x, FLOOR - h, f.w, h);
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < f.w / 22; i++) {
        const fx = f.x + f.w - (time * 200 + i * 47) % f.w;
        circ(fx, FLOOR - h + 1 + Math.sin(time * 9 + i) * 1.5, 2 + (i % 3) * 0.7); ctx.fill();
      }
      rr(x1 - 5, 204, 10, FLOOR - 204, 3); paint('rgba(120,200,160,.75)', null);   // pouring from the outfall
    }

    circ(x1, 200, 10); paint('#0b0d1c', INK, 5.5); paint(null, '#5d6f66', 3);
    circ(x1, 185, 2.2); paint(ph === 1 && Math.floor(time * 10) % 2 ? '#ffe066' : ph === 2 ? '#ff4d5e' : '#4a567f', INK, 0.8);
  }
}
function drawHazards() {
  drawFlushes();
  drawSteamers();
  for (const sx of SOCKS) if (vis(sx - 26, 30)) drawSock(sx, windAt(sx));
  for (const sx of SIGNS) {
    if (!vis(sx - 8, 16)) continue;

    const ph = jetPhase(j);
    if (ph === 2) {
      ctx.fillStyle = j.kind === 'steam' ? 'rgba(255,255,255,.7)' : j.kind === 'fume' ? 'rgba(157,240,106,.75)' : 'rgba(191,233,255,.8)';
      for (let i = 0; i < 6; i++) {

      }

    rr(j.x - 8, FLOOR - 2, 16, 4, 1); paint('#4a567f', INK, 1);
    ctx.beginPath();
    for (let x = -5; x <= 5; x += 3.3) { ctx.moveTo(j.x + x, FLOOR - 1); ctx.lineTo(j.x + x, FLOOR + 1); }
    paint(null, INK, 1);
    circ(j.x + 12, FLOOR - 8, 2); paint(ph === 1 && Math.floor(time * 10) % 2 ? '#ffe066' : ph === 2 ? '#ff4d5e' : '#4a567f', INK, 0.8);

      ctx.beginPath(); ctx.moveTo(ic.x - 2.2 + jx, ic.y + 1.5); ctx.lineTo(ic.x - 2.2 + jx, ic.y + 9.5); paint(null, '#ffe066', 1);

    paint(vgrad(ic.y, ic.y + 14, '#ffffff', '#bfe9ff'), '#5b7fa6', 1);
  }
}

function drawBackground() {

    if (q.look === 'shaft') {
      // a stairwell drop: flights receding into the dark

      for (let i = 0; i < 3; i++) { ctx.moveTo(q.x + 2, FLOOR + 10 + i * 12); ctx.lineTo(q.x + q.w - 2, FLOOR + 3 + i * 12); }

    } else if (q.look === 'gap') {

      ctx.fillStyle = 'rgba(255,179,71,.3)'; ctx.fillRect(q.x, 262, q.w, 8);
      circ(q.x + u * q.w, 265, 1); paint('#ffffff', null);

      ctx.fillStyle = vgrad(258, H, '#9df06a', '#2c8a2a'); ctx.fillRect(q.x, 258, q.w, H - 238);
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const u = (time * 0.6 + i * 0.37) % 1;
        circ(q.x + q.w * (i + 0.5) / 3, 258 - u * 8, 1.6 * (1 - u * 0.5)); paint('#9df06a', '#1f5a2a', 0.8);
      }
    }
    for (const hx of [q.x - 12, q.x + q.w]) {

      paint(null, INK, 1.4);
    }
    ctx.beginPath(); ctx.moveTo(q.x, FLOOR); ctx.lineTo(q.x, H + 20); ctx.moveTo(q.x + q.w, FLOOR); ctx.lineTo(q.x + q.w, H + 20); paint(null, INK, 1.5);
  }

  // gantries the professor taunts from, each with a door behind it
  for (const g of GANTRIES) {
    if (!vis(g.x, g.w)) continue;
    rr(g.door - 20, 30, 40, 48, 4); paint(vgrad(30, 78, '#2b3558', '#1c2342'));
    rr(g.door - 14, 36, 28, 13, 2); paint('#6f8fb5', INK, 1);
    rr(g.door - 16, 54, 32, 9, 2); paint('#ffe066', INK, 1);
    text(g.label || 'EXIT', g.door, 59, 6.5, INK);
    for (const x of [g.x + 6, g.x + g.w - 6]) {
      ctx.beginPath(); ctx.moveTo(x, -4); ctx.lineTo(x, GANTRY_Y); paint(null, INK, 3.5); paint(null, '#8494bd', 1.8);
    }
    rr(g.x, GANTRY_Y, g.w, 6, 2); paint(vgrad(GANTRY_Y, GANTRY_Y + 6, '#8494bd', '#5d6f9e'));
    ctx.beginPath();
    for (let x = g.x + 10; x < g.x + g.w; x += 10) { ctx.moveTo(x, GANTRY_Y + 1.5); ctx.lineTo(x, GANTRY_Y + 4.5); }
    paint(null, 'rgba(35,43,77,.5)', 1);
  }

  for (const vx of VENTS) if (vis(vx - 16, 32)) drawVent(vx);
  CHECKPOINTS.forEach((c, i) => { if (i && vis(c.x - 12, 24)) drawCheckpoint(c, i); });
  for (const pl of PLATS) if (vis(pl.x, pl.w)) drawPlat(pl);

}

function drawFlask(f) {

  ctx.restore();
}
// pulsing landing marker, shown for the whole flight
function drawReticle(x, y, w = 20) {

function drawPickup(k) {
  if (k.landed && k.life < 3 && Math.floor(k.life * 8) % 2 === 0) return;

  if (k.chute && !k.landed) {
    ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-3, -5); ctx.moveTo(9, -14); ctx.lineTo(3, -5); paint(null, INK, 0.8);
    ctx.beginPath(); ctx.arc(0, -14, 9.5, Math.PI, 0); ctx.closePath(); paint('#ff8fa3', INK, 1.3);
  }
  if (k.type === 'ethanol') {
    rr(-4, -4, 8, 10, 2.2); paint(vgrad(-4, 6, '#ffd08a', '#ff9d2e'), INK, 1.3);
    rr(-2, -7, 4, 3.4, 1); paint('#e6edf7', INK, 1);
    text('E', 0, 1.4, 6, INK);
  } else if (k.type === 'ppe') {
    // box of gloves
    rr(-5, -4, 10, 10, 2); paint('#ffffff', INK, 1.3);
    rr(-3.4, -1.6, 4.4, 5.6, 1.6); paint('#4aa3ff', INK, 0.8);

  // the postdocs rescued in this run (the last eight) jog in from the left and line up
  run.saved.slice(-8).forEach((hair, k) => {
    const from = ARENA.x0 - 30 - 24 * k, to = ARENA.x0 + 40 + 16 * k;
    drawPostdoc({ hair }, from + (to - from) * v.line, FLOOR, v.line < 1 ? 'in' : 'hop');
  });
  if (v.box > 0) drawTransportBox(bx, FLOOR, v.lid, t >= 3.4, v.box);
  if (t < 3.4) {
    // the vial: held high, then tossed into the box
    const u = v.toss, hx = p.x + 6.5, hy = p.y - 34;
    const x = hx + (bx - hx) * u, y = hy + (FLOOR - 12 - hy) * u - 14 * Math.sin(Math.PI * u);
    if (t < 2.2) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = time * 2 + i * TAU / 8;
        ctx.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8); ctx.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14);
      }
      paint(null, 'rgba(125,255,90,.8)', 1.5);
    }
    drawVial(x, y, 1.4);
  }
}

// Screen space text of the capture ending.
function drawEndingText(v, t) {

// Screen layer of a closing cutscene and of the results screen that follows it.
function drawCutOverlay() {
  const D = cs.def, v = cs.v, t = cs.t;
  if (D.overlay) D.overlay(v, t);
  if (D.tracks.bars) {
    const bh = BAR_H * v.bars;

  }
