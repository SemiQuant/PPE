  if (v.fade != null) { ctx.fillStyle = `rgba(8,10,24,${v.fade})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'results') drawResults();
  else drawSkipPrompt();
}

function drawBossBar(b) {
  // the bar fills up during the entrance and jolts when hit
  const K = BOSSES[b.kind];
  const fill = b.mode === 'intro' ? clamp(b.t - (K.C.introT - 1), 0, 1) : 1;
  const jy = b.hitT > 0 ? Math.sin(time * 90) : 0;
  text(K.bar, W / 2, 245, 6.5, '#ffffff', 'center', INK);
  rr(130, 251 + jy, 220, 8, 4); paint('rgba(16,20,43,.75)', INK, 1.5);
  if (b.lag > b.hp) { rr(132, 253 + jy, 216 * b.lag / b.hpMax, 4, 2); paint('#ffffff', null); }
  if (b.hp > 0) { rr(132, 253 + jy, Math.max(1, 216 * b.hp / b.hpMax * fill), 4, 2); paint(vgrad(251, 259, '#ff6b78', '#c93a48'), null); }
  ctx.fillStyle = INK;
  for (const th of K.marks) ctx.fillRect(132 + 216 * th / b.hpMax - 0.5, 252 + jy, 1, 6);
}

    }

  }

  rr(70, 12, 8, 1.8, 0.6); paint('#f0525e', null);

  circ(102.8, 14.8, 1.1); paint(null, INK, 0.7); circ(105.5, 14.8, 1.1); paint(null, INK, 0.7);
  text(lvl.rescued + '/' + POSTDOCS.length, 110.5, 15.4, 7, '#ffffff', 'left', INK);

  ctx.globalAlpha = kit.bombs ? 1 : 0.4;
  drawTube(138, 14.5, 1, 0.25);
  text('x' + kit.bombs, 145, 15.4, 7, '#ffffff', 'left', INK);
  ctx.globalAlpha = 1;
  if (kit.bleach) {
    rr(164.2, 9.4, 2.6, 2, 0.5); paint('#4aa3ff', INK, 0.7);

  }

  }

    rr(x, S.y, S.w, S.h, 4); paint(sel ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)', call ? RES.glow : sel ? '#ffe066' : INK, sel || call ? 1.5 : 1);
    if (own) drawWeaponIcon(id, x + 9.5, S.y + 8);
    else text('?', x + 9.5, S.y + 8.5, 9, INK);
    if (id === 'p10') { circ(x + 8.1, S.y + 17.5, 1.4); paint(null, INK, 0.8); circ(x + 10.9, S.y + 17.5, 1.4); paint(null, INK, 0.8); }   // never runs out

    if (sel) { ctx.beginPath(); ctx.moveTo(x + 6.5, 30.5); ctx.lineTo(x + 9.5, 27.5); ctx.lineTo(x + 12.5, 30.5); ctx.closePath(); paint('#ffe066', INK, 0.8); }
  });

    text(bannerText, W / 2, 120, 16, '#ffffff', 'center', INK);

  if (lock && lock.warns) {
    for (const w of lock.warns) {

}

const DRAW_ENEMY = { blob: drawBlob, puff: drawPuffer, rod: drawRod, phage: drawPhage, rat: drawRat, biofilm: drawBiofilm, taq: drawTaq, pigeon: drawPigeon };

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.lineJoin = 'round';
  ctx.clearRect(0, 0, W, H);
  if (state === 'intro' || state === 'title') { renderIntro(); return; }
  if (state === 'inter') { renderInter(); return; }
  if (state === 'keys') { renderKeys(); return; }

  // world layer: everything in here is in world pixels under the camera
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 10);
  ctx.translate(-Math.round(camX * scale) / scale, 0);

  drawBackground();
  if (oldMan.mode !== 'off' && vis(oldMan.x - 20, 40)) drawOldMan(oldMan);
  const fin = (state === 'ending' || state === 'results') && !!cs;   // a closing cutscene, or the report over its last frame
  const K = BOSSES[boss.kind], bossOn = vis(boss.x - 80, 130);
  if (bossOn) K.draw(boss);
  if (fin && cs.def.world) cs.def.world(cs.v, cs.t);
  POSTDOCS.forEach((d, i) => {
    const st = lvl.pd[i], r = lvl.pdr[i];
    if (st === 2 || !vis((st ? r.x : d.x) - 12, 24)) return;
    if (st === 0) {
      drawPostdoc(d, d.x, d.y, 'tied');
      if (Math.floor(time * 2) % 2 === 0) bubble('MMPH!', d.x + 4, d.y - 40);
    } else {
      // hops any pit on the way out
      const hop = inPit(r.x) ? 14 : 0;
      drawPostdoc(d, r.x, r.y - hop, r.t > PD_SAY_T ? 'run' : 'stand');
      if (r.t < PD_SAY_T) bubble(r.say, d.x, d.y - 40);
    }
  });
  for (const k of pickups) if (vis(k.x - 10, 20)) drawPickup(k);
  for (const e of enemies) if (vis(e.x - 24, 48)) { DRAW_ENEMY[e.type](e); if (e.res) drawResMark(e); }
  for (const s of shots) drawShot(s);
  for (const s of spores) { circ(s.x, s.y, 2.6); paint('#d6b3ff', '#3a216e', 1.1); }
  for (const f of flasks) { drawReticle(f.tx, f.ty); if (f.kind === 'glob') drawGlob(f.x, f.y); else drawFlask(f); }
  if (lock && lock.warns) {
    // bubbles where a biofilm mat is about to grow
    for (const w of lock.warns) {
      if (w.sp.from !== 'floor') continue;
      for (let i = 0; i < 3; i++) { const u = (time * 2 + i * 0.33) % 1; circ(w.sp.x - 7 + i * 7, FLOOR - 2 - u * 12, 1.5 + u * 1.5); paint('#9df06a', '#1f5a2a', 0.7); }
    }
  }

  const p = player;
  const hidden = fin && cs.v.ninOn === 0;   // a cutscene can take her off screen
  if (state !== 'over' && state !== 'dead' && !hidden && !(p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0)) drawNinja(p);

  for (const b of bullets) {
    if (b.kind === 'spray') {
      ctx.globalAlpha = clamp(b.life / b.max + 0.2, 0, 1);
      circ(b.x, b.y, 1.4 + (1 - b.life / b.max) * 2.6); paint('#ffc56e', null);
      ctx.globalAlpha = 1;
    } else {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      drawBullet(b);
      ctx.restore();
    }
  }
  for (const b of bombs) drawTube(b.x, b.y, 1, b.rot);
  for (const c of clouds) if (vis(c.x - 40, 80)) drawCloud(c);
  if (boss.active && bossOn) K.fx(boss);
  for (const q of particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    circ(q.x, q.y, q.r); paint(q.color, null);
  }
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life * 2, 0, 1);
    const hw = Math.max(30, f.str.length * 2 + 4);   // long lines stay on screen too
    text(f.str, clamp(f.x, camX + hw, camX + W - hw), f.y, 6.5, f.color, 'center', INK);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // screen layer: tints, HUD and overlays
  const sec = sectionAt(camX + W / 2);
  // the alarm runs hotter in the last phase of the boss fight and dies away in the ending
  const rage = boss.active && boss.phase === 3 && !boss.dead;
  const tint = rage ? 0.10 + 0.07 * Math.sin(time * 11) : 0.06 + 0.05 * Math.sin(time * 7);
  ctx.fillStyle = `rgba(255,40,60,${tint * (cs && cs.v.alarm != null ? cs.v.alarm : 1) * (sec.alarm ?? 1)})`;
  ctx.fillRect(0, 0, W, H);
  if (sec.wash) { ctx.fillStyle = sec.wash; ctx.fillRect(0, 0, W, H); }
  drawVignette();
  if (boss.mode === 'dead' && boss.t < 0.3) {
    // white flash on the killing blow
    ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - boss.t / 0.3)})`; ctx.fillRect(0, 0, W, H);
  }
  if (fin) { drawCutOverlay(); return; }
  if (state === 'results') { drawResults(); return; }   // a report with no cutscene behind it

  const gust = windAt(camX + W / 2);
  if (gust) {
    // streaks across the screen: a few thin ones in the warning, a sheet of them in the blow
    ctx.beginPath();
    for (let i = 0; i < (gust === 2 ? 14 : 4); i++) {
      const x = W + 40 - (time * 400 + i * 83) % (W + 80), y = 18 + (i * 47) % 196;
      ctx.moveTo(x, y); ctx.lineTo(x - 20 - (i * 13) % 21, y + 1);
    }
    paint(null, gust === 2 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.1)', gust === 2 ? 1.5 : 1);
  }
  drawHud();
  if (state === 'pause') {
    const armed = pauseArm > 0;
    ctx.fillStyle = 'rgba(20,26,51,.7)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, 70, 24, '#ffffff', 'center', INK);
    textFit(HELP_TXT[0], W / 2, 96, 6.5, W - 16, '#c9d4f5');
    textFit(HELP_TXT[1], W / 2, 108, 6.5, W - 16, '#c9d4f5');
    PAUSE_BTN.forEach((R, i) => {
      rr(R.x, R.y, R.w, R.h, 6); paint(i === 1 && armed ? '#ff6b78' : i === pauseSel ? '#ffe066' : 'rgba(255,255,255,.75)', INK, 1.5);
      text(['RESUME', armed ? 'SURE? AGAIN TO QUIT' : 'QUIT TO TITLE', 'CONTROLS'][i], W / 2, R.y + R.h / 2 + 0.5, i ? 9 : 10, INK);
    });
    if (!isTouch) textFit(keyNames('pause') + ' or Esc: resume    Up, Down, Enter: choose' + (quitKeyFree() ? '    Q: quit' : ''), W / 2, 200, 6.5, W - 16, '#ffffff', 'center', INK);
    text(progress > levelN + 1 ? 'Quitting ends this run. Continue on the title starts level ' + progress + '.' : 'Quitting restarts this level from its beginning.', W / 2, 212, 6, '#c9d4f5');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(20,26,51,.55)'; ctx.fillRect(0, 0, W, H);
    text('CONTAINMENT FAILED', W / 2, 108, 24, '#ff6b78', 'center', INK);
    text('Score ' + score + '    Best ' + best, W / 2, 140, 11, '#ffffff', 'center', INK);
    if (stateT > 0.7 && Math.floor(time * 2) % 2 === 0) text(isTouch ? 'TAP TO RETRY' : 'PRESS ANY KEY TO RETRY', W / 2, 166, 10, '#ffe066', 'center', INK);
    const gifts = overStreak >= OVER_STREAK;
    text('Retry from the last checkpoint. Level score resets.' + (gifts ? ' Or take some help:' : ''), W / 2, 181, 6.5, '#ffffff', 'center', INK);
    if (gifts) OVER_GIFTS.forEach((g, i) => {
      rr(g.x, g.y, g.w, g.h, 5); paint('rgba(255,224,102,.9)', INK, 1.2);
      text((isTouch ? '' : (i + 1) + ': ') + g.name, g.x + g.w / 2, g.y + 8, 7.5, INK);
      text(g.why, g.x + g.w / 2, g.y + 18, 5, INK);
    });
    const Q = OVER_QUIT;
    rr(Q.x, Q.y, Q.w, Q.h, 5); paint('rgba(255,255,255,.75)', INK, 1.2);
    text(isTouch ? 'QUIT TO TITLE' : 'Esc: QUIT TO TITLE', W / 2, Q.y + Q.h / 2 + 0.5, 6.5, INK);
  }
}

// ---------- Intro and title ----------
// The BSL-3 lab set, INTRO_W wide, in its own world space. v holds the cutscene track values.
function drawIntroLab(v) {
  const S = LEVELS[0].sections[0], on = v.alarm > 0;
  ctx.fillStyle = vgrad(0, FLOOR, S.wall[0], S.wall[1]); ctx.fillRect(-60, -60, INTRO_W + 120, FLOOR + 60);
  ctx.fillStyle = vgrad(FLOOR, H, S.floor[0], S.floor[1]); ctx.fillRect(-60, FLOOR, INTRO_W + 120, H - FLOOR + 60);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= INTRO_W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, FLOOR); }
  for (let y = 30; y < FLOOR; y += 40) { ctx.moveTo(0, y); ctx.lineTo(INTRO_W, y); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let x = 0; x < INTRO_W; x += 48) ctx.fillRect(x, FLOOR, 24, H - FLOOR + 60);
  ctx.fillStyle = INK; ctx.fillRect(-60, FLOOR - 0.75, INTRO_W + 120, 1.5);
  // entry and exit doors: the panels slide up into the wall
  for (const [x, y, w, h, open, label] of [[40, 172, 44, 58, v.doorL, 'BSL-3'], [640, 166, 50, 64, v.doorR, 'EXIT']]) {
    rr(x, y, w, h, 4); paint('#0b0d1c', INK, 1.5);
    ctx.save();
    rr(x, y, w, h, 4); ctx.clip();
    rr(x, y - h * open, w, h, 4); paint(vgrad(y, y + h, '#2b3558', '#1c2342'), INK, 1.5);
    rr(x + 8, y + 8 - h * open, w - 16, 13, 2); paint('#6f8fb5', INK, 1);

// ---------- Debug hook ----------
// For automated tests. It only reads state or calls the same functions the game uses.
window.__cb = {
  get auto() { return dbg.auto; },       // when false, frame() renders but does not call update()
  set auto(v) { dbg.auto = !!v; },
  get god() { return dbg.god; },         // when true, hurtPlayer() and pit damage are ignored
  set god(v) { dbg.god = !!v; },
  get state() { return state; },
  get player() { return player; },
  get boss() { return boss; },
  get enemies() { return enemies; },
  get lvl() { return lvl; },
  get cs() { return cs; },               // live cutscene: cs.t, cs.v
  get results() { return results; },
  get level() { return levelN + 1; },
  get levels() { return LEVELS.map(l => ({ id: l.id, name: l.name, worldW: l.worldW, boss: l.boss, checkpoints: l.checkpoints.map(c => c.id) })); },
  get run() { return run; },
  get kit() { return kit; },
  get pickups() { return pickups; },
  get bullets() { return bullets; },
  get progress() { return progress; },
  set progress(v) { progress = clamp(v | 0, 1, LEVELS.length); try { localStorage.setItem('cb-level', progress); } catch (e) {} },
  get done() { return done; },
  get inter() { return inter; },
  menu(i) { menuSel = i === 2 ? 2 : i ? 1 : 0; },
  clearSave() { progress = 1; done = false; menuSel = 0; best = 0; fastest = 0; resetBinds(); for (const k of ['cb-level', 'cb-best', 'cb-fast', 'cb-done', KEYS_STORE]) try { localStorage.removeItem(k); } catch (e) {} },
  // key bindings: action id -> [key, alternate or null], as KeyboardEvent.code values
  get actions() { return ACTIONS.map(a => ({ id: a.id, name: a.name, def: a.def.slice() })); },
  get bindings() { return Object.fromEntries(ACTIONS.map(a => [a.id, binds[a.id].slice()])); },
  rebind(action, slot, code) { return setBind(action, slot, code); },   // returns { ok, msg }, the same call the controls screen makes
  clearAlt(action) { return clearAlt(action); },
  resetKeys() { resetBinds(); },
  keyLabel(code) { return keyLabel(code); },
  keyRefuse(code) { return keyRefuse(code); },
  get help() { return HELP_TXT.slice(); },
  hintText(id) { return HINT_TXT[id]; },
  get keysUi() { return { ...kc, pauseSel, cell: keyCell(kc.sel, kc.col), reset: KEYS_UI.reset, back: KEYS_UI.back }; },   // the controls screen cursor
  snapshot() {
    const p = player;
    return {
      state, stateT, time, runTime, score, lives, ppe: p.ppe, weapon: kit.sel, ammo: kit.sel === 'p10' ? -1 : kit.ammo[kit.sel],
      x: p.x, y: p.y, onGround: p.onGround, aimDown: p.aimDown, camX, camMin, camMax, locked: !!lock,
      level: levelN + 1, levelId: L.id, section: sectionAt(p.x).id, cp: lvl.cp, rescued: lvl.rescued, deaths: lvl.deaths,
      nEnemies: enemies.length, nShots: shots.length, nBullets: bullets.length, enc: { ...lvl.enc },
      boss: { active: boss.active, hp: boss.hp, phase: boss.phase, mode: boss.mode, x: boss.x }, bossKind: boss.kind,
      csT: cs ? cs.t : null, cut: cs ? cs.def.id : null, resultsKind: results ? results.kind : null, progress,
      menuSel, interN: inter ? inter.n + 1 : null, done, best, fastest, wantPause, away: away(), held: [...kbHeld],
      run: { from: run.from, score0: run.score0, continues: run.continues, time: run.time, stats: run.stats, saved: run.saved.length },
      kit: { ...kit, ammo: { ...kit.ammo } }, hint: hint.t > 0 ? hint.str : '',
      nBombs: bombs.length, nClouds: clouds.length, nPools: pools.length, nWaves: waves.length,
      nRes: enemies.filter(e => e.res).length, nItems: pickups.filter(k => k.item != null).length,
      crack: boss.kind === 'chair' ? crackOf(boss.hp) : 0, shield: boss.shield || 0, wind: windAt(p.x),
    };
  },
  // goto(level, target, t): level is 1 based. target is 'start', a checkpoint id, 'boss' (the last checkpoint of any level),
  // 'bossfight' (t is the phase, 1 to 3), 'bossdown' (defeat played out, the exit condition not yet met), 'ending' (the level's
  // closing cutscene, t is its time), 'results' (level report), 'final' (campaign report, last level only) or 'inter'
  // (the card before that level).
  // goto(target, t) with a string first acts on the current level, and also takes 'intro' (t is the cutscene time), 'title'
  // 'over' and 'keys' (the controls screen, opened from the pause when a level is running, else from the title).
  // Returns false for unknown targets.
  goto(a, b, c) {
    if (typeof a === 'number') {
      if (!LEVELS[a - 1]) return false;
      if (b === 'inter') { initRun(a - 1); startInter(a - 1); return true; }
      if (b === 'final' && a !== LEVELS.length) return false;
      if (state !== 'play' && state !== 'pause' && state !== 'dead' && state !== 'over' || levelN !== a - 1) { initRun(a - 1); startLevel(a - 1); }
      return b == null || b === 'start' ? true : this.goto(b, c);
    }
    const id = a, t = b;
    if (id === 'intro') { startIntro(); if (t != null) { cs.t = t; csEval(); } return true; }
    if (id === 'title') { toTitle(); return true; }
    if (id === 'keys') {
      if (state === 'keys') return true;
      if (state === 'play') pauseGame();
      if (state !== 'pause') toTitle();
      openKeys(state);
      return true;
    }
    if (id === 'over') { if (state === 'intro' || state === 'title') initGame(); setState('over'); return true; }
    if (id === 'final' && levelN !== LEVELS.length - 1) return false;
    if (id === 'bossfight' || id === 'bossdown' || id === 'ending' || id === 'results' || id === 'final') {
      this.goto('boss');
      if (id === 'bossfight' && t >= 1 && t <= 3) boss = makeBoss(t);
      player.x = ARENA.trig + 10; camX = ARENA.x0;
      boss.seen = true;                  // no entrance
      startBoss();
      if (id === 'bossfight') return true;
      // fast forward through the defeat until the level's exit is ready
      BOSSES[boss.kind].down();
      const ready = () => boss.kind === 'review' ? boss.wreck : boss.vial && boss.vial.rest;
      for (let i = 0; i < 600 && state === 'play' && !ready(); i++) updateBoss(STEP);
      particles = []; shake = 0;
      if (id === 'bossdown') return true;
      if (state === 'play') startOutro();
      if (id === 'results' || id === 'final') { csSkip(); finishLevel(); if (id === 'final') finishRun(); }
      else if (t != null) { cs.t = t; csEval(); }
      return true;
    }
    const i = id === 'boss' ? CHECKPOINTS.length - 1 : CHECKPOINTS.findIndex(c => c.id === id);
    if (i < 0) return false;
    if (state === 'intro' || state === 'title') initGame();
    const cx = CHECKPOINTS[i].x;
    lock = null;
    lvl.cp = i;
    for (const en of ENCOUNTERS) if (en.trig < cx) lvl.enc[en.id] = 2;
    PLACED.forEach((r, k) => { if (r.x < cx) lvl.placed[k] = 2; });
    for (const sp of PROF_SPOTS) if (sp.trig != null && sp.trig < cx) lvl.seen[sp.id] = true;   // no cameo from far behind
    respawn();
    return true;
  },
  // puts the ninja inside the nearest unused decon shower
  decon() {
    const c = CHECKPOINTS.find((c, i) => i > lvl.cp && Math.abs(player.x - c.x) < 200);
    if (c) Object.assign(player, { x: c.x, y: FLOOR, vy: 0, onGround: true, onPlat: false });
    return !!c;
  },
  tap(x, y) { press('', x, y, 8); },     // logical coordinates: pause icon, HUD slots and buttons
  give(type, n = 1) { for (let i = 0; i < n; i++) collect({ type, x: player.x, y: player.y - 11, life: 1 }); },
  select(id) { selectWeapon(id); },
  bomb() { throwBomb(); },
  spawn(type, x, opts) { return spawnEnemy(type, x, opts); },
  hintNow() { return hint.t > 0 ? hint.str : ''; },
  get bombs() { return bombs; },
  get shots() { return shots; },
  get flasks() { return flasks; },
  get pools() { return pools; },
  get waves() { return waves; },
  get oldMan() { return oldMan; },
  get flushes() { return FLUSHES.map(flushPhase); },   // 0 off, 1 warning, 2 on, one per flush zone of the level
  get steamers() { return STEAMERS.map(steamPhase); }, // the same for the autoclave blast zones
  get winds() { return WIND_ZONES.map(windPhase); },   // 0 calm, 1 warning, 2 blowing, one per wind zone
  get icicles() { return icicles; },
  get particles() { return particles; },
  get clouds() { return clouds; },
  get floaters() { return floaters; },
  key(code) { press(code); },
  finishLevel() { finishLevel(); },
  finishRun() { finishRun(); },
  step(n = 1) { for (let i = 0; i < n; i++) update(STEP); },
  render() { render(); },
  press(name) { if (name === 'any') press(''); else setKey(name, true); },
  release(name) { if (name !== 'any') setKey(name, false); },
  killAll() { for (const e of enemies.slice()) if (e.hp > 0) killEnemy(e); enemies = enemies.filter(e => e.hp > 0); },
  bossHp(v) { boss.hp = v; },            // the next step() handles the phase break or defeat
  setPlayer(fields) { Object.assign(player, fields); },
};

// ---------- Loop ----------
startIntro();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!dbg.auto) acc = 0;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
